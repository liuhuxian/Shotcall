<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>导演工作台 · 原型 v0.1</title>
<style>
:root{
  --bg:#0c0e11; --panel:#14171c; --panel2:#191d24; --line:#242a33;
  --tx:#e7eaf0; --mut:#8b93a3; --dim:#5c6474;
  --acc:#4a9eff; --ok:#3ecf8e; --warn:#f5a524; --bad:#f05252; --draft:#a78bfa;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c333d;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

.banner{background:linear-gradient(90deg,#1b2230,#141a24);border-bottom:1px solid var(--line);
  padding:7px 18px;font-size:12px;color:var(--mut);display:flex;gap:14px;align-items:center}
.banner b{color:var(--warn);font-weight:600}
header{display:flex;align-items:center;gap:16px;padding:14px 20px 0}
h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
.sub{color:var(--dim);font-size:12px}
nav{display:flex;gap:2px;padding:12px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{padding:9px 14px;border-radius:8px 8px 0 0;color:var(--mut);font-size:13px;white-space:nowrap;border:1px solid transparent;border-bottom:none}
nav button:hover{color:var(--tx);background:var(--panel)}
nav button.on{color:var(--tx);background:var(--panel);border-color:var(--line);position:relative;top:1px}
nav button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px;vertical-align:1px}

main{padding:18px 20px 60px;max-width:1560px;margin:0 auto}
.epsel{position:relative;display:inline-block}
.epbtn{display:flex;align-items:center;gap:7px;padding:2px 7px 2px 0;border:none;
  background:none;font-size:12.5px;color:var(--mut);border-radius:6px}
.epbtn:hover{color:var(--tx)}
.epbtn:hover .cur{text-decoration:underline;text-underline-offset:3px}
.epbtn .proj{color:var(--dim)}
.epbtn .sep{color:var(--dim)}
.epbtn .cur{color:var(--tx)}
.epbtn .car{color:var(--dim);font-size:10px;margin-left:1px}
.st{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.epmenu{position:absolute;left:0;top:calc(100% + 8px);width:330px;max-height:430px;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:40;
  box-shadow:0 16px 40px rgba(0,0,0,.55);padding:5px}
.epitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12.5px}
.epitem:hover{background:var(--panel2)}
.epitem.on{background:#1b2430}
.epitem .n{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);min-width:42px}
.epitem.on .n{color:var(--acc)}
.epitem .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epitem .s{font-size:10.5px;color:var(--dim)}
.muted{color:var(--mut)} .dim{color:var(--dim)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;line-height:18px;border:1px solid}
.b-ok{color:var(--ok);border-color:#1e5b43;background:#0f2a20}
.b-warn{color:var(--warn);border-color:#5c421a;background:#2a1f0d}
.b-bad{color:var(--bad);border-color:#5c2323;background:#2a1212}
.b-mut{color:var(--mut);border-color:var(--line);background:#12151a}
.b-acc{color:var(--acc);border-color:#1c3f66;background:#0f1c2b}
.b-draft{color:var(--draft);border-color:#3b2f63;background:#1a1630}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi{font-size:26px;font-weight:600;letter-spacing:.5px}
.kpi small{font-size:12px;color:var(--mut);font-weight:400;margin-left:4px}
.grid4.compactKpi .card{padding:7px 12px;border-radius:8px}
.grid4.compactKpi .muted{font-size:11px}
.grid4.compactKpi .kpi{font-size:20px;line-height:1.15;margin-top:2px}
.grid4.compactKpi .kpi small{font-size:11px}
.grid4.compactKpi .dim{font-size:10px;margin-top:1px!important}

.grid5{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.grid5 .card{padding:8px 12px;border-radius:8px}
.grid5 .muted{font-size:11px}
.grid5 .kpi{font-size:21px;line-height:1.15;margin-top:2px}
.grid5 .kpi small{font-size:11px}
.grid5 .dim{font-size:10px;margin-top:1px!important}

.row{display:flex;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.ph{padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut);
  display:flex;justify-content:space-between;align-items:center;letter-spacing:.4px}
.pb{padding:12px 14px}

list,.bare{list-style:none;margin:0;padding:0}
.sitem{padding:9px 12px;border-bottom:1px solid #1b2028;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.sitem:hover{background:var(--panel2)}
.sitem.on{background:#1b2430;box-shadow:inset 3px 0 0 var(--acc)}
.sitem .n{font-size:11px;color:var(--dim);min-width:26px;font-family:ui-monospace,monospace}
.sitem .t{flex:1;min-width:0}
.sitem .t div:first-child{font-size:13px}
.sitem .t div:last-child{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.read{max-width:640px;font-size:15px;line-height:1.85}
.read .act{color:#cfd6e2;margin:0 0 14px}
.read .line{display:flex;gap:10px;margin:0 0 9px;padding:5px 10px;border-radius:6px;cursor:text}
.read .line:hover{background:#161a21}
.read .spk{color:var(--acc);min-width:44px;flex-shrink:0;font-size:13px;padding-top:2px}
.read .spk.q{color:#e0a458}
.read .spk.w{color:#b98cd6}
.read .txt{color:#eef1f6}
.read .line:hover::after{content:"＋意见";font-size:11px;color:var(--dim);align-self:center;margin-left:auto}

.kv{display:grid;grid-template-columns:76px 1fr;gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--dim)} .kv dd{margin:0;color:#cbd3df}

.verdict{display:flex;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:#101318}
.btn{padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-size:13px}
.btn:hover{border-color:#38414e}
.btn.ok{color:#0b1a12;background:var(--ok);border-color:var(--ok);font-weight:600}
.btn.warn{color:#241703;background:var(--warn);border-color:var(--warn);font-weight:600}
.btn.acc{color:#04121f;background:var(--acc);border-color:var(--acc);font-weight:600}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.42;cursor:not-allowed}

.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
.cell:hover{border-color:#3a4655;transform:translateY(-1px)}
.cell .ci{padding:8px 9px 7px}
.cell .cid{font-size:11px;font-family:ui-monospace,monospace;color:#aab3c2;letter-spacing:.2px}
.cell .cd{font-size:17px;font-weight:600;line-height:1.25}
.cell .cd small{font-size:11px;color:var(--dim);font-weight:400}
.cell .cb{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.cell .noimg{height:34px;background:repeating-linear-gradient(45deg,#12151a,#12151a 6px,#161b22 6px,#161b22 12px);border-bottom:1px solid var(--line)}
.sect{margin:0 0 10px;font-size:12px;color:var(--mut);display:flex;gap:10px;align-items:center;letter-spacing:.4px}
.sect:before{content:"";width:3px;height:12px;background:var(--acc);border-radius:2px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--line);font-size:12px;color:var(--mut);cursor:pointer}
.chip.on{color:var(--tx);border-color:#3a4a5e;background:#1b2430}

.refrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #1b2028}
.refrow img{width:72px;height:48px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.miss{width:72px;height:48px;border-radius:5px;border:1px dashed #5c2323;background:#1e1212;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--bad);text-align:center;line-height:1.3}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #1b2028;vertical-align:top}
tr:hover td{background:#12161c}

.cand{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1;min-width:0}
.cand .poster{position:relative;aspect-ratio:16/10;background:#000}
.cand .poster img{width:100%;height:100%;object-fit:cover;opacity:.92}
.cand .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cand .play span{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.cand .meta{padding:10px 12px;font-size:12px;color:var(--mut)}
.cand.sel{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.cand .acts{display:flex;gap:6px;padding:0 12px 12px}
.cand .acts .btn{flex:1;padding:6px 0;text-align:center;font-size:12.5px}

.modal{position:fixed;inset:0;background:rgba(4,6,9,.72);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#0a0c0f;color:#f2f5f9;
  border:1px solid #2b3542;padding:11px 20px;border-radius:9px;font-size:13px;z-index:3000;
  box-shadow:0 10px 34px rgba(0,0,0,.65);max-width:70vw;text-align:center}

.alert{display:flex;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);margin-bottom:8px;cursor:pointer}
.alert:hover{border-color:#3a4655}
.alert .ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.bar{height:6px;background:#1d222a;border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.bar.ok i{background:var(--ok)}
</style>
</head>
<body>
<div class="banner">
  <span><b>静态原型</b> · 只读演示</span>
  <span>数据<b>真实</b>（从项目文件解析）</span>
  <span>交互为<b>模拟</b>，不会保存任何修改</span>
  <span style="margin-left:auto" class="dim" id="bannerStat"></span>
</div>
<header>
  <div>
    <h1>导演工作台</h1>
    <div class="epsel" id="projsel"></div>
    <div class="epsel" id="epsel"></div>
  </div>
</header>
<nav id="nav"></nav>
<main id="app"><div id="statusbar"></div><div id="pageBody"></div></main>
<div id="viewerhost"></div>
<div id="toastHost"></div>

<script>
const D = __DATA__;
const IMG = __IMG_JSON__;
const S = D.stats;

/* ---- 原型内的模拟状态（仅内存） ---- */
const state = {
  tab:"stages", wf:"flow", hideIgnored:true, workflowOpen:{video:false,image:false}, ep:"EP002", scene:D.scenes[0].id, shot:"SHOT-EP002-SC001-03A",
  filter:"all", verdicts:{}, picks:{}, candModal:null, batchModal:null, reasonChips:[], drafts:{}, preflight:null, plan:null, exec:null
};
const vkey=(t,id)=>t+"::"+id;
const vget=(t,id)=>state.verdicts[vkey(t,id)];
const vset=(t,id,v)=>{ state.verdicts[vkey(t,id)]=v; };

const SPKCLASS = {"陈铭":"", "秦淮":"q", "妻子":"w"};
const mmss = sec => {
  if(sec==null || isNaN(sec)) return "—";
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return m + ":" + String(s).padStart(2,"0");
};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = n => (n>=60 ? (n/60).toFixed(1)+" 分" : n+" 秒");
const shotById = id => D.shots.find(s=>s.id===id);
const sceneById = id => D.scenes.find(s=>s.id===id);

function toast(msg){
  const h=document.getElementById("toastHost");
  h.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(window.__t); window.__t=setTimeout(()=>h.innerHTML="",2800);
}
function tryAssetGen(name){
  const hasPrompt = !!(D.files||{})["图片提示词.md"];
  if (!hasPrompt) {
    toast("还不能出图：本集缺 图片提示词.md（工作流第 08 步）");
    return;
  }
  toast("候选 = 同一提示词出 4 个变体，挑一张采用；生成入口在下方批次单");
}

function go(tab, opts){
  if(tab !== state.tab && typeof VIEW !== "undefined" && VIEW && VIEW.inline){
    VIEW = {path:null, inline:false};
  }
  Object.assign(state, opts||{}, {tab});
  if(tab !== state.tab) { /* noop */ }
  if(tab === 'gen'){
    GEN.loaded = false;                 // 每次进生成台都重新读单元与确认状态
    render();
    if(GEN.scene) loadGen(GEN.scene, true).then(()=>render());
    return;
  }
  if(tab === 'backend'){
    BK.data = null;                       // 先清空，避免显示旧快照
    render();
    loadBackend(true).then(()=>render());
    return;
  }
  renderForce();
}

/* ---------- 通用组件 ---------- */
function selOf(shotId){
  return (D.selections||[]).find(s=>s.shot===shotId) || null;
}
function selBadge(shotId){
  const s=selOf(shotId);
  if(!s) return "";
  if(s.status==="adopt") return '<span class="badge b-ok">已采用</span>';
  if(s.status==="backup") return '<span class="badge b-acc">备选</span>';
  return '<span class="badge b-warn">重做</span>';
}
function staleOf(type,id){
  const d=(D.decisions||[]).find(x=>x.unit.type===type&&x.unit.id===id);
  return d&&d.stale ? (d.staleFiles||[]) : null;
}
function staleBadge(type,id){
  const f=staleOf(type,id);
  return f?`<span class="badge b-warn" title="依据文件已变更：${esc(f.join("、"))}">文件已变更·需复核</span>`:"";
}
function verdictBadge(v){
  if(v==="pass") return `<span class="badge b-ok">通过</span>`;
  if(v==="revise") return `<span class="badge b-warn">需修改</span>`;
  if(v==="hold") return `<span class="badge b-mut">待定</span>`;
  return `<span class="badge b-mut" style="opacity:.65">未审</span>`;
}

function reviewDot(tab){
  if(!D || !D.workflow) return "";
  const wf = D.workflow.find(w=>w.episode===D.episode);
  if(!wf) return "";
  const keyMap = {r1:"review1", r1a:"review2", r2:"review3", pick:"review4"};
  const key = keyMap[tab]; if(!key) return "";
  const idx = wf.steps.findIndex(s=>s.key===key);
  if(idx < 0) return "";
  const st = wf.steps[idx];
  let color, tip;
  if(st.status === "done"){ color = "var(--ok)"; tip = "已完成"; }
  else {
    color = st.ready ? "var(--warn)" : "#3a4655";
    tip = st.ready ? "可以审，尚未审完" : "还没到这一步";
  }
  return `<i class="dot" title="${tip}" style="background:${color};margin-left:6px"></i>`;
}

function nav(){
  const items=[
    ["stages","工作流"],["scenes","场次"],["assets","资产"],["shots","镜头"],
    ["gen","生成台"],["first","首帧"],["backend","算力"],["pending","待确认"],["verify","校验"]];
  paint("#nav", items.map(([k,label])=>{
    const dot = reviewDot(k);
    return `<button class="${state.tab===k?'on':''}" onclick="go('${k}')">${label}${dot}</button>`;
  }).join(""));
}

const TAB_LABEL = {history:"生成历史", backend:"算力", stages:"工作流", flow:"流程", img:"出图", first:"首帧", scenes:"场次", gen:"生成台", assets:"资产", shots:"镜头", stage:"阶段详情", pending:"待确认", arts:"成果清单", verify:"校验", legacy:"旧界面", overview:"总览", workflow:"工作流", dev:"开发", r1:"审核一 · 剧本", r1a:"审核二 · 资产",
  r2:"审核三 · 分镜", shot:"单镜详情", checks:"检查", pick:"审核四 · 挑片", batch:"视频生成",
  img:"出图 · 资产", img2:"出图 · 分镜", export:"修改单"};

function emptyPanel(key){
  const label = TAB_LABEL[key] || key;
  return `<div class="panel" style="max-width:760px">
    <div class="ph"><span><b>${esc(state.ep)}</b> · ${esc(label)}</span><span class="badge b-mut">空白</span></div>
    <div class="pb">
      <div class="dim" style="font-size:13px;line-height:1.9">
        本集还没有对应的创作文档，所以这一页是空的。<br>
        这不是加载失败，也不是卡住——${esc(state.ep)} 目前只有大纲。
      </div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn acc" onclick="go('workflow')">看这一集的流程</button>
        <button class="btn ghost" onclick="go('overview')">回全剧总览</button>
      </div>
      <div class="dim mono" style="font-size:11px;margin-top:16px">当前页面：${esc(key)}</div>
    </div></div>`;
}

/* ---------- 开发（原著拆解 · 人物圣经 · 分集大纲） ---------- */
function sDev(){
  const dv = D.dev || {};
  const sa = dv.sourceAnalysis || {files:[]};
  const bb = dv.bible || {characters:[], totalEvidence:0};
  const eps = D.episodes||[];

  const files = (sa.files||[]).map(f=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid #1b2028">
    <span style="font-size:12.5px">${esc(f.name)}</span><span class="dim mono" style="font-size:11px">${f.kb} KB</span></div>`).join("");

  const chars = (bb.characters||[]).map(c=>`<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #1b2028">
    <span style="min-width:56px;font-size:13px">${esc(c.name)}</span>
    <span class="dim" style="flex:1;font-size:11.5px">${esc(c.desc||"")}</span>
    <span class="badge b-acc">${c.evidence} 条</span></div>`).join("");

  const rows = eps.map(e=>`<tr style="cursor:pointer" onclick="pickEp('${e.id}')">
    <td class="mono" style="color:${e.id===state.ep?'var(--acc)':'var(--dim)'}">${e.id}</td>
    <td>${esc(e.title)}</td>
    <td class="dim" style="text-align:center">${e.chapters?e.chapters[0]+"–"+e.chapters[1]:"—"}</td>
    <td class="dim mono" style="text-align:center">${mmss(e.target)}</td></tr>`).join("");

  return `
  <div class="grid4" style="margin-bottom:14px">
    <div class="card"><div class="muted" style="font-size:12px">拆解文件</div><div class="kpi">${(sa.files||[]).length}<small>份</small></div></div>
    <div class="card"><div class="muted" style="font-size:12px">人物分册</div><div class="kpi">${(bb.characters||[]).length}<small>位</small></div></div>
    <div class="card"><div class="muted" style="font-size:12px">原文证据</div><div class="kpi">${bb.totalEvidence||0}<small>条</small></div></div>
    <div class="card"><div class="muted" style="font-size:12px">分集</div><div class="kpi">${eps.length}<small>集</small></div></div>
  </div>

  <div class="row" style="gap:14px;align-items:flex-start;margin-bottom:14px">
    <div class="panel" style="width:46%">
      <div class="ph"><span>原著拆解</span><span class="dim">项目开发/source-analysis/</span></div>
      <div class="pb">${files || '<div class="dim">尚未拆解</div>'}</div>
    </div>
    <div class="panel grow">
      <div class="ph"><span>人物圣经</span><span class="dim">novel-analyzer · 每条带原文行号</span></div>
      <div class="pb">
        ${chars || '<div class="dim">尚未生成人物圣经</div>'}
        ${(bb.minor||[]).length?`<div class="dim" style="font-size:11.5px;margin-top:8px">次要人物：${(bb.minor||[]).map(esc).join("、")}</div>`:""}

/* ---------- 算力 ---------- */
let BK = {data:null, xz:{}};   // xz: 二次确认缓存
let EXEC = {videos:null, images:null, loaded:false};

async function loadBackend(force){
  if(BK.data && !force) return BK.data;
  try{ BK.data = await (await fetch('/api/backend')).json(); }catch(e){ BK.data = null; }
  return BK.data;
}

function confirmGate(key, label, fn){
  const now = Date.now();
  const armed = BK.xz[key] && BK.xz[key] > now;
  if(!armed){
    BK.xz[key] = now + 5000;
    render();
    toast("再点一次确认" + label + "（5 秒内有效）");
    return;
  }
  delete BK.xz[key];
  fn();
}

async function backendAction(card, action, label){
  const run = async ()=>{
    if(action === 'start'){ BK.starting = card; render(); }
    const r = await fetch('/api/backend/action', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action, card})});
    const j = await r.json();
    if(!r.ok) return toast(j.error||"操作失败");
    BK.starting = null;
    toast(label + "：卡" + card + " 已执行");
    await loadBackend(true); render();
  };
  if(action === 'interrupt' || action === 'stop' || action === 'restart'){
    confirmGate(action+card, (action==='interrupt'?'中断':action==='stop'?'停止':'重启'), run);
  } else { run(); }
}

function cardColor(st){
  return st === 'free' ? 'var(--ok)' : st === 'busy' ? 'var(--warn)'
       : st === 'full' ? 'var(--bad)' : 'var(--dim)';
}

function cardsGrid(d){
  const cards = d.cards || [];
  const cells = cards.map(c=>{
    const color = cardColor(c.state);
    const inst = c.instance;
    const xz = (k)=>BK.xz[k] && BK.xz[k] > Date.now();
    const prog = inst && inst.progress && inst.progress.max
      ? Math.round(inst.progress.value / inst.progress.max * 100) : 0;
    return `<div style="border:1px solid ${color};border-radius:9px;background:var(--panel);padding:10px 12px">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:6px">
        <i class="dot" style="background:${color};width:8px;height:8px"></i>
        <b style="font-size:13px">卡 ${c.card}</b>
        <span class="dim mono" style="font-size:10.5px">:${c.port}</span>
        <span class="dim" style="margin-left:auto;font-size:10.5px">${(()=>{
          const q = (inst && inst.queue) || {};
          if(c.hasInstance){
            if(q.run > 0) return '生成中';
            if(q.pend > 0) return '排队中';
            return '空闲待命';
          }
          if(c.usedGB != null && c.usedGB > 8) return '他进程占用';
          return '未启动';
        })()}</span>
      </div>
      <div class="bar" style="margin:0 0 4px"><i style="width:${c.pct||0}%;background:${color}"></i></div>
      <div class="mono dim" style="font-size:10.5px;margin-bottom:8px">
        ${c.usedGB!=null ? c.usedGB+' / '+c.totalGB+' GB · '+c.pct+'%' : '显存读取失败'}
      </div>
      ${inst ? `
        <div class="mono dim" style="font-size:10px;margin-bottom:6px">
          pid ${inst.pid||'—'} · ComfyUI：${inst.queue?inst.queue.run:0} 在跑${(inst.queue&&inst.queue.pend)?` · ${inst.queue.pend} 已送达待跑`:''}
          ${inst.job?` · 当前 ${esc(inst.job.label)}`:''}
        </div>
        <div class="bar" style="margin:0 0 8px"><i style="width:${prog}%;background:var(--acc)"></i></div>
        ${(d.summary&&d.summary.pendingLocal)?`<div class="dim" style="font-size:10px;margin-bottom:6px;color:var(--warn)">全台还有 ${d.summary.pendingLocal} 项在等空闲卡</div>`:''}
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          <button class="btn ghost" style="font-size:10.5px;padding:2px 8px" onclick="backendAction(${c.card},'interrupt','中断')">${xz('interrupt'+c.card)?'确认？':'中断'}</button>
          <button class="btn ghost" style="font-size:10.5px;padding:2px 8px" onclick="backendAction(${c.card},'clear','清空队列')">清队</button>
          <button class="btn ghost" style="font-size:10.5px;padding:2px 8px" onclick="backendAction(${c.card},'restart','重启')">${xz('restart'+c.card)?'确认？':'重启'}</button>
          <button class="btn warn" style="font-size:10.5px;padding:2px 8px" onclick="backendAction(${c.card},'stop','停止')">${xz('stop'+c.card)?'确认？':'停止'}</button>
        </div>` : `
        <button class="btn acc" style="font-size:11px;padding:3px 10px;width:100%"
          ${BK.starting===c.card?'disabled':''}
          onclick="backendAction(${c.card},'start','启动实例')">
          ${BK.starting===c.card?'启动中…':'启动实例'}</button>`}
    </div>`;
  }).join("");
  return `<div class="panel" style="margin-bottom:14px">
    <div class="ph"><span>显卡占用</span>
      <span class="dim">绿=空闲 · 橙=有占用 · 红=接近满载 · “他进程占用”=非本工作台 · 手动启停，不自动扩缩</span></div>
    <div class="pb" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px">${cells}</div>
  </div>`;
}

async function stopJob(id, btn){
  const now = Date.now();
  if(!BK.stopUntil || BK.stopArm !== id || BK.stopUntil < now){
    BK.stopArm = id; BK.stopUntil = now + 5000;
    if(btn) btn.textContent = '确认停止';
    toast("再点一次停止该任务（5 秒内有效）");
    setTimeout(()=>{ if(BK.stopUntil && BK.stopUntil < Date.now()){ BK.stopArm = null; render(); } }, 5200);
    return;
  }
  BK.stopArm = null;
  const job = ((BK.data && BK.data.jobs) || []).find(x=>x.id === id) || {};
  const ep = job.kind === 'image' ? '/api/img/cancel' : '/api/gen/cancel';
  const r = await fetch(ep, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ids:[id]})});
  const j = await r.json();
  if(!r.ok) return toast(j.error || "停止失败");
  const msg = (j.interrupted||[]).length ? "已中断当前任务"
            : (j.cancelled||[]).length ? "已从队列移除" : "没有可停止的任务";
  toast(msg);
  await loadBackend(true); render();
}

function queueHtml(d){
  const jobs = d.jobs || [];
  if(!jobs.length) return `<div class="panel" style="margin-top:6px">
    <div class="ph"><span>生成队列</span><span class="dim">没有排队或运行中的任务</span></div></div>`;
  const now = Date.now()/1000;
  const rows = jobs.map((j,i)=>{
    const LABEL = {running:'生成中', waiting:'ComfyUI 排队', dispatched:'已派发', queued:'待派卡', aborted:'已中断'};
    const isCloud = String(j.channel||'').toLowerCase()==='codex';
    const running = j.status === 'running';
    const wait = j.startedAt ? Math.round(now - j.startedAt) : (j.queuedAt ? Math.round(now - j.queuedAt) : 0);
    const color = running ? 'var(--acc)' : (j.status === 'waiting' ? 'var(--warn)' : 'var(--dim)');
    return `<tr style="border-left:2px solid ${color}">
      <td class="mono dim" style="width:34px">${i+1}</td>
      <td style="width:78px"><span class="badge ${running?'b-acc':(j.status==='waiting'?'b-warn':'b-mut')}" style="font-size:10px">${LABEL[j.status]||j.status}</span></td>
      <td class="mono" style="width:74px">${j.unit||'—'}${j.seq?` #${j.seq}`:''}</td>
      <td class="dim" style="width:56px">${j.kind==='video'?'视频':'图片'}</td>
      <td class="mono" style="width:74px">${isCloud?'<span class="badge b-acc" style="font-size:9.5px">codex</span>':`<span class="dim">${j.card!=null?('卡'+j.card):'待分配'}</span>`}</td>
      <td class="dim mono" style="width:80px">${j.seconds?j.seconds+'秒/'+j.frames+'帧':''}</td>
      <td class="dim" style="width:70px">${j.kind==='video'?(j.refs?('参考图 '+j.refs+' 张'):'无参考图'):'—'}</td>
      <td class="dim mono" style="width:92px">${running
        ? (j.execStartedAt ? '已用 '+Math.round((now-j.execStartedAt)/60)+' 分' : '刚开始')
        : '已等 '+Math.round((j.waitSec||0)/60)+' 分'}</td>
      <td class="dim mono" style="width:110px">${j.etaSec!=null?('约 '+Math.ceil(j.etaSec/60)+' 分后完成'):(j.totalSec?('预计 '+Math.round(j.totalSec/60)+' 分'):'—')}</td>
      <td class="dim mono" style="font-size:10.5px">${esc((j.id||'').slice(-22))}</td>
      <td style="text-align:right;width:76px">
        <button class="btn warn" style="font-size:10px;padding:1px 7px"
          onclick="stopJob('${esc(j.id)}', this)">${BK.stopArm===j.id?'确认停止':'停止'}</button>
      </td>
    </tr>`;
  }).join("");
  const run = jobs.filter(j=>j.status==='running').length;
  return `<div class="panel" style="margin-top:6px">
    <div class="ph"><span>生成队列</span><span class="dim">${jobs.length} 项 · 生成中 ${run} · 排队 ${jobs.length-run} · 预估按 ${d.ratePerFrame||6.8} 秒/帧（本机实测）</span></div>
    <div class="pb"><table><thead><tr><th>#</th><th>状态</th><th>单元</th><th>类型</th><th>渠道</th><th>规格</th><th>参考</th><th>时间</th><th>预计</th><th>任务号</th><th style="text-align:right">操作</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
}

let VIEW = {path:null, data:null, loading:false, rendered:true};
let RENDER_FORCE = false, RENDER_SKIPPED = 0;
function renderForce(){ RENDER_FORCE = true; try{ render(); } finally{ RENDER_FORCE = false; } }

function mdToHtml(md){
  const esc2 = s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines = md.split('\n');
  let out = [], inCode = false, table = [];
  const flushTable = ()=>{
    if(!table.length) return;
    const rows = table.map(r=>r.split('|').slice(1,-1).map(c=>c.trim()));
    const head = rows[0], body = rows.slice(2);
    out.push(`<table style="width:100%;border-collapse:collapse;margin:6px 0;font-size:12px">
      <thead><tr>${head.map(c=>`<th style="border:1px solid var(--line);padding:4px 7px;text-align:left;background:#151a20">${inline(c)}</th>`).join("")}</tr></thead>
      <tbody>${body.map(r=>`<tr>${r.map(c=>`<td style="border:1px solid var(--line);padding:4px 7px;vertical-align:top">${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
    table = [];
  };
  const inline = s=>esc2(s)
    .replace(/`([^`]+)`/g,'<code style="background:#0f1216;padding:1px 4px;border-radius:3px;font-size:12px">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
  for(const ln of lines){
    if(ln.startsWith('```')){
      if(inCode){ out.push('</pre>'); inCode=false; }
      else { out.push('<pre style="background:#0f1216;border:1px solid var(--line);border-radius:6px;padding:9px 11px;overflow:auto;font-size:12px;line-height:1.7">'); inCode=true; }
      continue;
    }
    if(inCode){ out.push(esc2(ln)); continue; }
    if(/^\|.*\|\s*$/.test(ln)){ table.push(ln); continue; }
    flushTable();
    const h = ln.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n=h[1].length; out.push(`<h${n} style="margin:14px 0 6px;font-size:${20-n*2}px;color:#e6ebf3">${inline(h[2])}</h${n}>`); continue; }
    if(/^\s*[-*]\s+/.test(ln)){ out.push(`<div style="padding-left:16px;font-size:12.5px;line-height:1.9">· ${inline(ln.replace(/^\s*[-*]\s+/,''))}</div>`); continue; }
    if(!ln.trim()){ out.push('<div style="height:8px"></div>'); continue; }
    out.push(`<div style="font-size:12.5px;line-height:1.9">${inline(ln)}</div>`);
  }
  flushTable();
  if(inCode) out.push('</pre>');
  return out.join("\n");
}

let HIST = {data:null};

async function loadHistory(force){
  if(HIST.data && !force) return HIST.data;
  const q = HIST.showDeleted ? '?deleted=1' : '';
  try{ HIST.data = await (await fetch('/api/gen/history' + q)).json(); }catch(e){ HIST.data = {items:[]}; }
  return HIST.data;
}

function fmtDur(s){
  if(s == null) return '—';
  const m = Math.floor(s/60), r = Math.round(s%60);
  return m ? `${m} 分 ${r} 秒` : `${r} 秒`;
}

function toggleHistory(){
  GEN.showHistory = !GEN.showHistory;
  if(GEN.showHistory && !HIST.data){ loadHistory(true).then(()=>render()); }
  render();
}

let GEN = {scene:null, units:[], results:[], jobs:[], draft:{}, poll:null};

async function loadGen(scene, force){
  if(GEN.scene===scene && !force && GEN.loaded) return;
  GEN.scene = scene;
  try{
    const [u, r, j] = await Promise.all([
      fetch('/api/gen/units?scene='+encodeURIComponent(scene)).then(x=>x.json()),
      fetch('/api/gen/results?scene='+encodeURIComponent(scene)).then(x=>x.json()),
      fetch('/api/gen/jobs').then(x=>x.json()),
    ]);
    GEN.units = u.units||[]; GEN.results = r.results||[]; GEN.jobs = j.jobs||[];
    GEN.promptFile = u.promptFile || null; GEN.confirm = u.promptConfirm || {local:'none'};
    // 勾选状态由提示词声明决定；用户手动改过后保留用户选择
    if(!GEN.chain){ GEN.chain = {};
      (u.units||[]).forEach(x=>{ GEN.chain[x.id] = !!(x.chainFrom && x.chainReady); }); }
    GEN.resSig = JSON.stringify((r.results||[]).map(x=>[x.file, x.mtime]));
    GEN.loaded = true;
  }catch(e){ GEN.loaded = true; }
}

let VER = {list:null, pinned:null, current:null};

async function loadVersions(scene, force){
  if(VER.list && VER.scene===scene && !force) return VER;
  try{
    const j = await (await fetch('/api/gen/versions?scene='+encodeURIComponent(scene))).json();
    VER = {list:j.versions||[], pinned:j.pinned, current:(GEN.units&&GEN.units[0]?GEN.units[0].source:null), scene};
  }catch(e){}
  return VER;
}

async function pinVersion(name){
  const r = await fetch('/api/gen/version', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({scene: GEN.scene, file: name})});
  const j = await r.json();
  if(!r.ok) return toast(j.error||"切换失败");
  toast(j.pinned ? ('已锁定 '+name) : '已恢复自动取最新版');
  await loadVersions(GEN.scene, true);
  await loadGen(GEN.scene, true);
  render();
}

async function translateUnit(unitId, btn){
  if(btn){ btn.textContent = '翻译中…'; btn.disabled = true; }
  const r = await fetch('/api/gen/translate', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({scene: GEN.scene, units:[unitId]})});
  const j = await r.json();
  if(!r.ok){ toast(j.error || "翻译失败"); if(btn){ btn.textContent='翻译'; btn.disabled=false; } return; }
  const ok = (j.translated||[])[0];
  toast(ok ? `已翻译 ${ok.unit}（${ok.chars} 字）` : "翻译失败");
  await loadGen(GEN.scene, true);
  render();
}

async function translateAll(btn){
  const ids = (GEN.units||[]).map(u=>u.id);
  if(!ids.length) return toast("没有单元");
  if(btn){ btn.textContent = '翻译中…'; btn.disabled = true; }
  const r = await fetch('/api/gen/translate', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({scene: GEN.scene, units: ids})});
  const j = await r.json();
  if(!r.ok){ toast(j.error || "翻译失败"); if(btn){ btn.textContent='翻译全部'; btn.disabled=false; } return; }
  toast(`翻译完成：${(j.translated||[]).length} 个单元` + ((j.failed||[]).length?`，${j.failed.length} 个失败`:''));
  await loadGen(GEN.scene, true);
  render();
}

async function genDelete(file, btn){
  const key = 'del:' + file;
  const now = Date.now();
  if(!GEN.delArm || GEN.delArm.key !== key || GEN.delArm.until < now){
    GEN.delArm = {key, until: now + 5000};
    if(btn) btn.textContent = '确认删除';
    toast("再点一次删除这条视频（5 秒内有效）");
    setTimeout(()=>{ if(GEN.delArm && GEN.delArm.until < Date.now()){ GEN.delArm = null; render(); } }, 5200);
    return;
  }
  GEN.delArm = null;
  const r = await fetch('/api/gen/delete', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({file})});
  const j = await r.json();
  if(!r.ok) return toast(j.error || "删除失败");
  toast("已删除：" + file.split('/').pop());
  await loadGen(GEN.scene, true);
  render();
}

function toggleFs(v){
  if(!v) return;
  if(document.fullscreenElement){ document.exitFullscreen(); return; }
  (v.requestFullscreen ? v.requestFullscreen() : Promise.resolve()).catch(()=>{});
}

document.addEventListener('keydown', ev=>{
  const tag = (ev.target && ev.target.tagName) || '';
  if(tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if(ev.key === 'f' || ev.key === 'F'){
    const v = GEN.hoverVid || (document.fullscreenElement && document.fullscreenElement.tagName === 'VIDEO'
      ? document.fullscreenElement : null);
    if(v){ ev.preventDefault(); toggleFs(v); }
  }
});

function applyAllCount(v){
  const n = Math.max(1, Math.min(9, parseInt(v) || 1));
  GEN.bulk = n;
  GEN.count = {};
  (GEN.units || []).forEach(u => { GEN.count[u.id] = n; });
  render();
  toast(`所有单元次数设为 ${n}`);
}

async function submitGen(){
  const units = (GEN.units||[]).filter(u=>GEN.draft[u.id]!==false)
    .map(u=>({id:u.id, count:(GEN.count||{})[u.id]||1, chain:!!(GEN.chain||{})[u.id]}));
  if(!units.length) return toast("没有选中单元");
  const total = units.reduce((a,b)=>a+b.count,0);
  const seedRaw = String(GEN.seed||"").trim();
  const r = await fetch('/api/gen/submit', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({scene: GEN.scene, units, seed: seedRaw||null,
                          steps: GEN.steps||20, size: GEN.size||'1344x768'})});
  const j = await r.json();
  if(!r.ok) return toast(j.error||"提交失败");
  toast("已提交 "+j.jobs.length+" 条（共 "+total+" 次）：" + j.batch);
  setTimeout(()=>loadGen(GEN.scene,true).then(()=>render()), 3000);
}

const STAGE_STEPS = ["未开始","已写表演","已拆镜","已出片"];

function reviewBadge(st){
  const r = (st||{}).record;
  if(!r) return '<span class="badge b-mut" style="font-size:10px">未审</span>';
  if(st.stale) return '<span class="badge b-bad" style="font-size:10px">已失效</span>';
  if(r.verdict==='pass') return '<span class="badge b-ok" style="font-size:10px">通过</span>';
  if(r.verdict==='revise') return '<span class="badge b-warn" style="font-size:10px">需修改</span>';
  return '<span class="badge b-mut" style="font-size:10px">待定</span>';
}

function assetReviewBadge(st){
  const r = (st||{}).record;
  if(!r) return '<span class="badge b-mut" style="font-size:9.5px">未审</span>';
  if(st.stale) return '<span class="badge b-bad" style="font-size:9.5px">已失效</span>';
  if(r.verdict==='pass') return '<span class="badge b-ok" style="font-size:9.5px">通过</span>';
  if(r.verdict==='revise') return '<span class="badge b-warn" style="font-size:9.5px">修改</span>';
  return '<span class="badge b-mut" style="font-size:9.5px">待定</span>';
}

async function approveScene(scene, verdict){
  let note = '';
  if(verdict !== 'pass'){ note = prompt('场次意见（可空，会写进审批账本）') || ''; }
  const obj = ((SCN.data||{}).scenes||[]).find(x=>x.id===scene) || {};
  const r = await fetch('/api/approval', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({kind:'scene', target:'scene:'+scene, verdict, path: obj.reviewPath || null,
                          scope:{scene}, notes: note ? [{text:note}] : []})});
  const j = await r.json();
  if(!r.ok) return toast(j.error || '记录失败');
  toast((verdict==='pass'?'场次通过 ':verdict==='revise'?'场次需修改 ':'场次待定 ') + scene);
  SCN.data = null; await loadScenes(true); render();
}

function sceneReviewBar(){
  const d = SCN.data; if(!d) return '';
  const scenes = d.scenes||[];
  if(!scenes.length) return '';
  const passed = scenes.filter(x=>x.approval && x.approval.record && x.approval.record.verdict==='pass' && !x.approval.stale).length;
  const cards = scenes.map(x=>`<div style="border:1px solid ${x.approval&&x.approval.record&&x.approval.record.verdict==='pass'&&!x.approval.stale?'var(--ok)':'var(--line)'};
      border-radius:8px;padding:8px 10px;min-width:235px;background:var(--panel)">

  try{

  }catch(e){ SHOTS[scene] = {shots:[]}; }

}

function shotBadge(x){
  const st = x.approval || {}, r = st.record;
  if(!r) return '<span class="badge b-mut" style="font-size:10px">未审</span>';
  if(st.stale) return '<span class="badge b-bad" style="font-size:10px">已失效</span>';
  if(r.verdict==='pass') return '<span class="badge b-ok" style="font-size:10px">通过</span>';
  if(r.verdict==='revise') return '<span class="badge b-warn" style="font-size:10px">需修改</span>';
  return '<span class="badge b-mut" style="font-size:10px">待定</span>';
}

async function approveShot(scene, shot, verdict){
  let note = '';
  if(verdict !== 'pass'){ note = prompt('意见（可空，会写进审批记录）') || ''; }
  const cur = ((SHOTS[scene]||{}).shots||[]).find(s=>s.id===shot) || {};
  const r = await fetch('/api/approval', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({kind:'shot', target: scene+'/'+shot, verdict, path: cur.source || null,
                          scope:{scene, shot}, notes: note ? [{text:note}] : []})});
  const j = await r.json();
  if(!r.ok) return toast(j.error || '记录失败');
  toast((verdict==='pass'?'已通过 ':verdict==='revise'?'已标需修改 ':'已标待定 ') + shot);
  delete SHOTS[scene];
  await loadShots(scene, true);
  render();
}

function shotApprovalBar(scene){
  const sh = (SHOTS[scene]||{}).shots || [];
  if(!sh.length) return '';
  const passed = sh.filter(x=>x.approval && x.approval.record && x.approval.record.verdict==='pass' && !x.approval.stale).length;
  const cards = sh.map(x=>`<div style="border:1px solid ${x.approval&&x.approval.record&&x.approval.record.verdict==='pass'&&!x.approval.stale?'var(--ok)':'var(--line)'};
      border-radius:8px;padding:8px 10px;min-width:180px;background:var(--panel)">
    <div style="display:flex;align-items:center;gap:6px"><b class="mono">${x.id}</b>${shotBadge(x)}</div>
    <div class="dim" style="font-size:10.5px;margin-top:2px">${x.duration}s · ${esc((x.size||'').slice(0,18))}</div>
    <div style="display:flex;gap:3px;margin-top:6px">
      <button class="btn ok" style="font-size:10px;padding:1px 7px" onclick="approveShot('${scene}','${x.id}','pass')">通过</button>
      <button class="btn warn" style="font-size:10px;padding:1px 7px" onclick="approveShot('${scene}','${x.id}','revise')">需修改</button>
      <button class="btn ghost" style="font-size:10px;padding:1px 7px" onclick="approveShot('${scene}','${x.id}','hold')">待定</button>
    </div></div>`).join("");
  return `<div class="panel" style="margin-bottom:14px;border-color:${passed===sh.length?'var(--ok)':'var(--warn)'}">
    <div class="ph"><span>镜头确认 · ${scene}</span>
      <span class="dim">已通过 ${passed}/${sh.length} · 覆盖这些镜头的生成单元才允许提交</span></div>
    <div class="pb" style="display:flex;gap:8px;flex-wrap:wrap">${cards}</div>
    <div class="dim" style="padding:0 13px 10px;font-size:11px">生成门禁：提示词版本已确认 + 该单元覆盖的每个镜头都是“通过”；缺一项提交会被 400 拒绝并点名。</div>
  </div>`;
}

let PICK = {data:{}, sel:{}};
async function loadPicks(scene, force){
  if(PICK.data[scene] && !force) return PICK.data[scene];
  try{ PICK.data[scene] = await (await fetch('/api/pick/candidates?scene='+encodeURIComponent(scene))).json(); }
  catch(e){ PICK.data[scene] = {shots:[],error:String(e)}; }
  return PICK.data[scene];
}
function pickSelect(shot,file){
  PICK.sel[shot]=file;
  const v=document.getElementById('pickmain-'+shot);
  if(v) v.src='/api/proj/file?p='+encodeURIComponent(file);
  const root=document.getElementById('pickcands-'+shot);
  if(root) root.querySelectorAll('[data-pick]').forEach(el=>{
    const on=el.getAttribute('data-pick')===file;
    el.style.borderColor=on?'var(--acc)':'var(--line)';
    el.style.background=on?'rgba(90,160,255,.08)':'var(--panel)';
  });
}
async function pickAdopt(shot,action){
  const scene=state.scene||'N001';
  const file=PICK.sel[shot];
  if(!file && action==='adopt') return toast('先选一条候选视频');
  const reason=(document.getElementById('pickreason-'+shot)||{}).value||'';
  if(action==='adopt' && !reason.trim()) return toast('采用前写一句结构化原因（为什么这条）');
  const r=await fetch('/api/pick/adopt',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({scene,shot,file,action,reason})});
  const j=await r.json(); if(!r.ok) return toast(j.error||'记录失败');
  toast('已记录：'+shot+' '+action);
  await loadPicks(scene,true); render();
}
function exportPicks(fmt){
  const scene=state.scene||'N001';
  window.location='/api/pick/export?scene='+encodeURIComponent(scene)+'&format='+fmt;
}
function candidateWall(scene){
  const d=PICK.data[scene];
  if(!d){ loadPicks(scene).then(()=>render()); return `<div class="dim" style="font-size:11.5px;margin:8px 0">读取镜头候选…</div>`; }
  const shots=d.shots||[];
  const adopted=shots.filter(s=>s.adopted&&s.adopted.action==='adopt').length;
  const held=shots.filter(s=>s.adopted&&s.adopted.action==='hold').length;
  const cards=shots.map(s=>{
    const cands=(s.candidates||[]);
    const adoptedFile=(s.adopted&&s.adopted.file)||'';
    const sel=PICK.sel[s.id]||adoptedFile||((cands[0]||{}).file||'');
    PICK.sel[s.id]=sel;
    const pick=(cands.find(c=>c.file===sel)||{});
    const candCards=cands.slice(0,8).map(c=>`<div data-pick="${esc(c.file)}" onclick="pickSelect('${s.id}','${esc(c.file)}')"
      style="width:180px;border:1px solid ${c.file===sel?'var(--acc)':'var(--line)'};border-radius:6px;overflow:hidden;cursor:pointer;background:${c.file===sel?'rgba(90,160,255,.08)':'var(--panel)'}">
      <video src="/api/proj/file?p=${encodeURIComponent(c.file)}" muted preload="metadata"
        style="width:100%;height:101px;object-fit:cover;display:block;background:#000"></video>
      <div class="mono dim" style="font-size:9px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.unit)} · seed ${c.seed??'—'}</div>
    </div>`).join("");
    return `<div class="panel" style="margin-bottom:10px">
      <div class="ph"><span><b class="mono">${s.id}</b> · ${s.duration||0}s</span>
        <span style="display:flex;gap:8px;align-items:center">
          ${s.adopted&&s.adopted.action==='adopt'?`<span class="badge b-ok" style="font-size:10px">已采用</span>`:
            s.adopted?`<span class="badge b-warn" style="font-size:10px">${esc(s.adopted.action)}</span>`:
            `<span class="badge b-mut" style="font-size:10px">未挑片</span>`}
          <span class="dim" style="font-size:10px">${cands.length} 条候选</span></span></div>
      <div class="pb">
        ${cands.length?`<div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap">
          <div style="width:360px;max-width:100%"><video id="pickmain-${s.id}" src="/api/proj/file?p=${encodeURIComponent(sel)}" controls preload="metadata"
            style="width:100%;border-radius:7px;border:1px solid var(--line);background:#000"></video></div>
          <div style="flex:1;min-width:260px">
            <div class="dim mono" style="font-size:10px;line-height:1.7">单元 ${esc(pick.unit||'—')} · seed ${pick.seed??'—'} · batch ${esc(pick.batch||'—')}<br>
              prompt ${esc(pick.prompt||'—')} · 参考图 ${pick.refs??0} 张 · ${esc(pick.time||'')}</div>
            <input id="pickreason-${s.id}" placeholder="采用原因（结构化：表演/构图/接戏/声音）" value="${esc((s.adopted||{}).reason||'')}"
              style="width:100%;margin-top:7px;background:#0f1216;border:1px solid var(--line);color:#c9d2e0;border-radius:5px;padding:4px 7px;font-size:11px">
            <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:7px">
              <button class="btn ok" title="本镜最终选这条，进 EDL/CSV" style="font-size:10.5px;padding:2px 9px" onclick="pickAdopt('${s.id}','adopt')">采用选中</button>
              <button class="btn ghost" title="先留着，不进 EDL" style="font-size:10.5px;padding:2px 9px" onclick="pickAdopt('${s.id}','alternate')">备选</button>
              <button class="btn ghost" title="暂不决定，继续等" style="font-size:10.5px;padding:2px 9px" onclick="pickAdopt('${s.id}','hold')">待定</button>
              <button class="btn warn" title="这镜要重出，当前条不采用" style="font-size:10.5px;padding:2px 9px" onclick="pickAdopt('${s.id}','redo')">重做</button>
            </div></div></div>
          <div id="pickcands-${s.id}" style="display:flex;gap:7px;flex-wrap:wrap;margin-top:9px">${candCards}</div>`
          :`<div class="dim" style="font-size:11.5px">该镜暂无生成结果；先在生成台出片。</div>`}
      </div></div>`;
  }).join("");
  return `<div class="panel" style="margin-bottom:12px"><div class="ph"><span>镜头候选与采用</span>
    <span class="dim" style="display:flex;gap:8px;align-items:center">${shots.length} 镜 · 已采用 ${adopted} · hold ${held}
      <button class="btn ghost" style="font-size:10px;padding:2px 8px" onclick="exportPicks('csv')">导出 CSV</button>
      <button class="btn ghost" style="font-size:10px;padding:2px 8px" onclick="exportPicks('edl')">导出 EDL</button></span></div>
    <div class="dim" style="padding:0 13px 8px;font-size:10.5px;line-height:1.6">

    </div>
    <div class="pb">${cards||'<div class="dim">没有镜头数据</div>'}</div></div>`;

function sShots(){
  const d = SCN.data;
  if(!d){ loadScenes().then(()=>render()); return `<div class="dim">读取中…</div>`; }
  const scene = state.scene && d.scenes.some(s=>s.id===state.scene) ? state.scene : (d.scenes[0]||{}).id;

  const tabs = (d.scenes||[]).map(s=>`<span onclick="go('shots',{scene:'${s.id}'})" style="cursor:pointer;padding:4px 10px;border-radius:6px;font-size:11.5px;

  const rows = sh.map(x=>`<tr>
    <td class="mono" style="color:var(--acc)">${x.id}</td>

    <td style="font-size:12px">${esc((x.size||"").slice(0,40))}</td>
    <td class="dim" style="font-size:11.5px">${esc((x.action||"").slice(0,60))}</td>
    <td class="dim" style="font-size:11.5px">${esc((x.firstFrame||"").slice(0,40))}</td>
    <td class="dim" style="font-size:11.5px">${esc((x.lastFrame||"").slice(0,40))}</td>
    <td style="white-space:nowrap">
      ${shotBadge(x)}
      <div style="display:flex;gap:3px;margin-top:3px">
        <button class="btn ok" style="font-size:10px;padding:1px 6px" onclick="approveShot('${scene}','${x.id}','pass')">通过</button>
        <button class="btn warn" style="font-size:10px;padding:1px 6px" onclick="approveShot('${scene}','${x.id}','revise')">需修改</button>
        <button class="btn ghost" style="font-size:10px;padding:1px 6px" onclick="approveShot('${scene}','${x.id}','hold')">待定</button>

        <th style="width:150px">审核</th></tr></thead>
        <tbody>${rows}</tbody></table>`:'<div class="dim" style="font-size:12.5px">该场尚未拆镜（需要 09 阶段生成镜头表）。</div>'}
    </div></div>`;
}

  const open = state.cloudEdit;
  const inp = (id, val, ph, type) => `<input id="${id}" type="${type||'text'}" value="${esc(val||'')}" placeholder="${esc(ph)}"
    style="flex:1;min-width:160px;background:#0f1216;border:1px solid var(--line);color:#c9d2e0;border-radius:5px;padding:4px 8px;font-size:11.5px">`;

function toggleCloudEdit(){ state.cloudEdit = !state.cloudEdit; render(); }

async function saveCloudCfg(){
  const base=(document.getElementById('cloudBase')||{}).value||'';
  const key=(document.getElementById('cloudKey')||{}).value||'';
  const model=(document.getElementById('cloudModel')||{}).value||'';
  const r=await fetch('/api/cloud/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({base,key,model})});
  const j=await r.json(); if(!r.ok) return toast(j.error||'保存失败');
  CLOUD.data=j; state.cloudMsg=j.configured?'已保存':'已保存，但仍缺少字段：'+(j.reason||''); toast('云端出图配置已保存'); render();
}

async function checkCloudCfg(){
  state.cloudMsg='校验中…'; render();
  const r=await fetch('/api/cloud/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'check'})});
  const j=await r.json();
  state.cloudMsg = j.ok ? ('连接正常' + (j.modelFound===false?'（但模型不在列表里，检查 MODEL 名）':'') + (j.models&&j.models.length?(' · 可用模型：'+j.models.slice(0,6).join(', ')):''))
                        : ('校验失败：'+(j.error||'未知'));
  render();
}
async function approveAsset(assetId, verdict){
  let note = '';
  if(verdict !== 'pass'){ note = prompt('资产意见（可空，会写进审批账本）') || ''; }
  const d = AST.data || {};
  const r = await fetch('/api/approval', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({kind:'asset', target:'asset:'+assetId, verdict, path: d.doc || null,
                          scope:{asset:assetId}, notes: note ? [{text:note}] : []})});
  const j = await r.json();
  if(!r.ok) return toast(j.error || '记录失败');
  toast((verdict==='pass'?'资产通过 ':verdict==='revise'?'资产标记修改 ':'资产待定 ') + assetId);
  AST.data = null; await loadAssets(true); render();
}

async function setAssetIgnored(id, ignored){
  const r=await fetch('/api/asset/ignore',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({asset:id,ignored})});
  const j=await r.json(); if(!r.ok) return toast(j.error||'操作失败');
  toast((ignored?'已忽略 ':'已取消忽略 ')+id);
  AST.data=null; await loadAssets(true); render();
}

/* ---------- 资产详情：生成历史 + 出图/改图 ---------- */
let AD = null;

async function openAsset(id){
  if(!AST.data){ await loadAssets(); }
  const a=((AST.data&&AST.data.assets)||[]).find(x=>x.id===id) || null;
  AD = {id, ref:(a&&a.binding&&a.binding.image)||null, cands:[], jobs:[], refs:null, pickOpen:false, loading:true, channel:'local', extraRefs:[],
        prompt:(a&&(a.prompt||a.descriptor))||'', n:1, size:lastSize(), steps:8};
  render();
  await loadAssetDetail();
}
function closeAsset(){ clearAssetPoll(); AD=null; render(); }
function adAsset(){ return ((AST.data&&AST.data.assets)||[]).find(a=>a.id===AD.id) || null; }
async function loadAssetDetail(){
  if(!AD) return;
  const id=AD.id;
  try{ AD.cands=(await (await fetch('/api/img/candidates?asset='+encodeURIComponent(id))).json()).items||[]; }catch(e){}
  try{ const j=await (await fetch('/api/img/jobs')).json(); AD.jobs=(j.jobs||[]).filter(x=>x.asset===id); }catch(e){}
  AD.loading=false; render();
  scheduleAssetPoll();
}

let AD_POLL=null;
function assetTyping(){
  const el=document.activeElement, box=document.getElementById('assetDetail');
  return !!(el && box && box.contains(el) && /^(TEXTAREA|INPUT)$/.test(el.tagName));
}
function clearAssetPoll(){ if(AD_POLL){ clearTimeout(AD_POLL); AD_POLL=null; } }
function scheduleAssetPoll(){
  clearAssetPoll();
  if(!AD || !AD.jobs) return;
  const live=(AD.jobs||[]).filter(j=>j.status==='running'||j.status==='queued'||j.status==='pending');
  if(!live.length) return;
  AD_POLL=setTimeout(async()=>{
    if(!AD) return;
    if(assetTyping()){                                   // 正在输入：只局部更新候选与进度，不动输入框
      const before=(AD.cands||[]).length;
      await refreshAssetParts();
      if(AD && (AD.cands||[]).length>before) toast('有新候选：'+((AD.cands||[]).length-before)+' 张');
      scheduleAssetPoll(); return;
    }
    const before=(AD.cands||[]).length;
    await loadAssetDetail();
    if(AD && (AD.cands||[]).length>before) toast('有新候选：'+((AD.cands||[]).length-before)+' 张');
  }, 6000);
}
async function refreshAssetParts(){
  if(!AD) return;
  const id=AD.id;
  try{ const r=await (await fetch('/api/img/candidates?asset='+encodeURIComponent(id))).json(); AD.cands=r.items||[]; }catch(e){}
  try{ const j=await (await fetch('/api/img/jobs')).json(); AD.jobs=(j.jobs||[]).filter(x=>x.asset===id); }catch(e){}
  const strip=document.getElementById('assetCandStrip');
  if(strip && AD.cands){
    strip.innerHTML = AD.cands.slice(0,6).map(c=>`<div style="width:176px">
      <img src="/api/proj/file?p=${encodeURIComponent(c.file)}" onclick="openZoom('/api/proj/file?p=${encodeURIComponent(c.file)}')"
        style="width:100%;height:105px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block">
      <div class="mono dim" style="font-size:9px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</div>
      <button class="btn ok" style="font-size:9.5px;padding:1px 7px;margin-top:3px" onclick="adAdopt('${esc(c.file)}')">采用</button>
    </div>`).join("") || '<div class="dim" style="font-size:11.5px">还没有候选图。</div>';
  }
  const run=document.getElementById('assetRun');
  if(run){
    const live=(AD.jobs||[]).filter(x=>x.status==='running'||x.status==='queued').length;
    run.innerHTML = live?`<div style="margin:8px 0;padding:6px 9px;border:1px solid var(--warn);border-radius:6px;font-size:11px;color:var(--warn)">正在生成 ${live} 张 · 自动刷新</div>`:'';
  }
}

function openRunningPanel(){
  state.runningPanel = true;
  render();
  loadRunningJobs();
  if(window.__runTimer) clearInterval(window.__runTimer);
  window.__runTimer = setInterval(loadRunningJobs, 5000);
}
function closeRunningPanel(){
  state.runningPanel = false;
  if(window.__runTimer){ clearInterval(window.__runTimer); window.__runTimer=null; }
  render();
}
async function loadRunningJobs(){
  try{
    const d = await (await fetch('/api/assets')).json();
    state.runningJobs = d.running || [];
    if(AST.data && AST.data.summary) AST.data.summary.running = (d.summary||{}).running || 0;
  }catch(e){ state.runningJobs = []; }
  render();
}

async function openAllCands(){
  let items=[];
  try{ items=(await (await fetch('/api/img/candidates')).json()).items||[]; }catch(e){}
  state.candGallery={ id:'全部资产', files:items.map(x=>x.file), names:{}, assets:{} };
  items.forEach(x=>{ state.candGallery.names[x.file]=x.name; state.candGallery.assets[x.file]=x.asset; });
  render();
}
function openCandGallery(){
  state.candGallery = {id: (AD&&AD.id)||'', files: (AD&&AD.cands||[]).map(c=>c.file), names:{}};
  (AD&&AD.cands||[]).forEach(c=>{ state.candGallery.names[c.file]=c.name; });
  render();
}
function closeCandGallery(){ state.candGallery=null; render(); }
async function adoptFromGallery(file, asset){
  const aid = asset || (AD && AD.id) || '';
  if(!aid) return toast('缺少资产 ID');
  const r=await fetch('/api/img/adopt',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({asset:aid,file})});
  const j=await r.json(); if(!r.ok) return toast(j.error||'采用失败');
  toast('已采用：'+aid);
  AST.data=null; await loadAssets(); closeCandGallery();
}

function adRefs(a){
  const out=[];
  if(a && a.binding && a.binding.image) out.push({v:a.binding.image,label:'当前绑定 '+a.binding.version});
  (AD.cands||[]).forEach(c=>out.push({v:c.file,label:'候选 '+c.name}));
  return out;
}
async function adGenerate(){
  const a=adAsset(); if(!a) return;
  const prompt=(AD.prompt||'').trim();
  if(!prompt) return toast('提示词为空');
  const mode = AD.ref ? 'edit' : 't2i';
  const channel = AD.channel || 'local';
  const body={asset:a.id, mode, prompt:prompt.trim(), channel,
    n:parseInt(AD.n||1), size:AD.size||lastSize(), steps:parseInt(AD.steps||8)};
  if(AD.ref) body.ref = AD.ref;
  const extra=(AD.extraRefs||[]).filter(Boolean);
  const main=AD.ref || extra.shift() || null;
  if(main) body.ref = main;
  const allRefs=[main, ...extra].filter(Boolean);
  if(allRefs.length>1) body.refs=allRefs;
  const sz=body.size.split('x'); body.width=parseInt(sz[0]); body.height=parseInt(sz[1]);
  const label = channel==='codex' ? 'Codex' : '本机';
  AD.submitting = true; AD.notice = '正在提交到 '+label+'…';
  toast('正在提交到 '+label+'…');
  render();
  try{
    const r=await fetch('/api/img/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(!r.ok){
      AD.submitting=false; AD.notice='提交失败：'+(j.error||'未知');
      toast('提交失败：'+(j.error||''));
      render(); return;
    }
    const cnt=(j.jobs||[]).length;
    AD.submitting=false;
    AD.notice = '已提交 '+cnt+' 张 · '+(channel==='codex'?'Codex 约 1–2 分钟/张':'本机约 2 分钟/张')+' · 完成后自动刷新';
    toast('已提交 '+cnt+' 张到 '+label+' 队列');
    render();
    await loadAssetDetail();
    const keep = AD.notice;
    setTimeout(()=>{ if(AD && AD.notice===keep){ AD.notice=''; render(); } }, 8000);
  }catch(e){
    AD.submitting=false; AD.notice='提交失败：'+e;
    toast('提交失败：'+e); render();
  }
}
async function adLoadRefs(){
  try{ AD.refs=(await (await fetch('/api/img/refs')).json()).items||[]; }catch(e){ AD.refs=[]; }
  AD.pickOpen=true; render();
}
function adUseCurrent(){
  const a=adAsset(); const img=a&&a.binding&&a.binding.image;
  if(!img) return toast('当前没有绑定图，请用「引用其他」');
  AD.ref=img; AD.pickOpen=false; render();
}
function adPickOther(){
  if(AD.pickOpen && AD.pickMode!=='bind'){ AD.pickOpen=false; render(); return; }
  AD.pickMode='ref';
  if(AD.refs===null) return adLoadRefs();
  AD.pickOpen=true; render();
}
function adPickBind(){
  if(AD.pickOpen && AD.pickMode==='bind'){ AD.pickOpen=false; render(); return; }
  AD.pickMode='bind';
  if(AD.refs===null) return adLoadRefs();
  AD.pickOpen=true; render();
}
function adChooseRef(file){
  AD.extraRefs = AD.extraRefs || [];
  // 还没有主图：第一张选中的就是主图
  if(!AD.ref){ AD.ref = file; render(); return; }
  if(file === AD.ref){ AD.ref = AD.extraRefs.shift() || null; render(); return; }
  const i = AD.extraRefs.indexOf(file);
  if(i >= 0) AD.extraRefs.splice(i,1);
  else if(AD.extraRefs.length < 3) AD.extraRefs.push(file);
  else return toast('最多再引用 3 张');
  render();
}
function adDropExtra(file){
  AD.extraRefs = (AD.extraRefs||[]).filter(x=>x!==file); render();
}
async function adBrowse(dir){
  const q = dir ? ('?path='+encodeURIComponent(dir)) : '';
  try{
    const r = await fetch('/api/fs/browse'+q);
    const j = await r.json();
    if(!r.ok){ toast(j.error||'无法读取目录'); return; }
    AD.browse = j;
  }catch(e){ toast('读取失败：'+e); return; }
  render();
}
function adUsePath(){
  const v=((document.getElementById('adPath')||{}).value||'').trim();
  if(!v) return toast('先输入图片路径');
  AD.ref=v; AD.pickOpen=false; render();
}
async function adUpload(file){
  if(!file) return;
  const r=await fetch('/api/img/upload',{method:'POST',body:file,headers:{'X-Filename':file.name,'Content-Type':file.type||'application/octet-stream'}});
  const j=await r.json(); if(!r.ok) return toast(j.error||'上传失败');
  AD.ref=j.file; AD.pickOpen=false; toast('已引用：'+j.file); render();
}

async function adAdopt(file){
  const a=adAsset(); if(!a) return;
  const r=await fetch('/api/img/adopt',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({asset:a.id,file,ep:'EP002'})});
  const j=await r.json(); if(!r.ok) return toast(j.error||'采用失败');
  toast(j.unchanged?'这张已经是当前绑定':('已采用并写新绑定：'+(j.bindingFile||'')));

  AST.data=null; await loadAssets(); await loadAssetDetail();
}

/* ---------- 分镜首帧 ---------- */
let FF = {data:null, scene:null, pick:{}};

async function loadFirst(scene, force){
  if(!force && FF.data && FF.scene===scene) return FF.data;
  try{ FF.data = await (await fetch('/api/firstframe/shots?scene='+encodeURIComponent(scene))).json(); FF.scene=scene; }
  catch(e){ FF.data={shots:[],error:String(e)}; }
  return FF.data;
}

function ffPaintRefs(shot){
  const arr=Array.isArray(FF.pick[shot])?FF.pick[shot]:[];
  const root=document.getElementById('ffrefpick-'+shot);
  if(root) root.querySelectorAll('[data-ref]').forEach(el=>{
    const f=el.getAttribute('data-ref')||'';
    const on=f===''?arr.length===0:arr.includes(f);
    el.style.borderColor=on?'var(--acc)':'var(--line)';
    el.style.background=on?'rgba(90,160,255,.08)':'var(--panel)';
    const chk=el.querySelector('.ffchk'); if(chk) chk.textContent=on?'✓':'';
  });
  const hint=document.getElementById('ffrefhint-'+shot);
  if(hint) hint.textContent=ffRefHint(shot);
}
function ffPickRef(shot,file){
  let arr=Array.isArray(FF.pick[shot])?FF.pick[shot].slice():[];
  if(!file) arr=[];
  else if(arr.includes(file)) arr=arr.filter(x=>x!==file);
  else arr.push(file);
  FF.pick[shot]=arr; ffPaintRefs(shot);
}
function ffAllRefs(shot){
  const st=(FF.data&&FF.data.shots||[]).find(x=>x.id===shot)||{};
  FF.pick[shot]=(st.refs||[]).map(r=>r.file); ffPaintRefs(shot);
}
function ffClearRefs(shot){ FF.pick[shot]=[]; ffPaintRefs(shot); }

function ffRefHint(shot){
  const st=(FF.data&&FF.data.shots||[]).find(x=>x.id===shot)||{};
  const byFile={};
  (st.refs||[]).forEach(r=>{ byFile[r.file]=r.asset||''; });
  const files=Array.isArray(FF.pick[shot])?FF.pick[shot]:[];
  if(!files.length) return '本次不使用参考图：按文字描述生成首帧。';
  const lines=['参考图用法（提交时自动追加到提示词；按上传顺序，<Picture 1> 为主参考）：'];
  files.forEach((f,i)=>{
    const aid=byFile[f]||'参考图';
    const c=(aid||'').charAt(0).toUpperCase();
    let role='参考';
    if(c==='C') role='身份参考：保留脸型、五官、发型、眼镜、体态；服装、表情、站位、背景以文字为准；不要复制参考图的白底/多视图/拼图版式。';
    else if(c==='L') role='空间参考：只取空间布局、门窗、课桌/栏杆/楼梯关系与光源方向；不要复制空镜构图，也不要因为参考图里没人物就删人物。';
    else if(c==='P') role='道具参考：只取材质、磨损、状态与尺度；不要新增参考图外的道具。';
    lines.push(`<Picture ${i+1}> = ${aid}：${role}`);
  });
  lines.push('参考图只锁身份/空间/材质，不锁构图；与文字首帧状态冲突时以文字为准。输出单帧剧照，不是参考图的版式复制。');
  return lines.join('\n');
}

async function ffGenerate(shot){
  const scene=FF.scene||'N001';
  const prompt=(document.getElementById('ffp-'+shot)||{}).value||'';
  if(!prompt.trim()) return toast('提示词为空');
  const refs=Array.isArray(FF.pick[shot])?FF.pick[shot]:[];
  const hint=ffRefHint(shot);
  const fullPrompt=prompt.includes('参考图用法') ? prompt : (prompt.trim()+'\n\n'+hint);
  const r=await fetch('/api/firstframe/generate',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({scene,shot,prompt:fullPrompt,refs,n:1,width:1536,height:864,steps:6})});
  const j=await r.json(); if(!r.ok) return toast(j.error||'提交失败');
  toast('首帧已提交：'+(j.jobs||[]).join(', '));
  setTimeout(()=>loadFirst(scene,true).then(()=>render()), 5000);
}

async function ffAdopt(shot,file){
  const r=await fetch('/api/firstframe/adopt',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({scene:FF.scene||'N001',shot,file})});
  const j=await r.json(); if(!r.ok) return toast(j.error||'采用失败');
  toast('已采用首帧：'+shot);
  FF.data=null; await loadFirst(FF.scene||'N001',true); render();
}

let IMG2 = {data:null, sel:null, mode:'t2i', ref:null, jobs:[], cands:[], loading:false};

async function loadImg2(force){
  if(IMG2.data && !force) return IMG2.data;
  IMG2.loading = true;
  try{ IMG2.data = await (await fetch('/api/assets')).json(); }
  catch(e){ IMG2.data={assets:[],_err:String(e)}; }
  const list=(IMG2.data.assets||[]).filter(a=>a.type!=='voice' && (a.prompt||'').trim());
  if(!IMG2.sel || !list.some(a=>a.id===IMG2.sel)) IMG2.sel = list[0] ? list[0].id : null;
  await loadImg2Side();
  IMG2.loading = false;
  return IMG2.data;
}

async function loadImg2Side(){
  IMG2.jobs=[]; IMG2.cands=[];
  try{ IMG2.jobs=(await (await fetch('/api/img/jobs')).json()).jobs||[]; }catch(e){}
  if(IMG2.sel){
    try{ IMG2.cands=(await (await fetch('/api/img/candidates?asset='+encodeURIComponent(IMG2.sel))).json()).items||[]; }catch(e){}
  }
}

function imgAsset(){ return ((IMG2.data&&IMG2.data.assets)||[]).find(a=>a.id===IMG2.sel) || null; }

function imgRefOptions(a){
  const opts=[];
  if(a && a.binding && a.binding.image) opts.push({v:a.binding.image,label:'当前绑定 '+a.binding.version});
  (IMG2.cands||[]).forEach(c=>opts.push({v:c.file,label:'候选 '+c.name}));
  return opts;
}

  const a=imgAsset(); if(!a) return toast('先选资产');

  const ref=mode==='edit'?(refSel?refSel.value:null):null;
  if(mode==='edit' && !ref) return toast('改图要先选底图');
  const body={asset:a.id, mode, prompt:prompt.trim(), ref,
              n:parseInt((document.getElementById('imgN')||{}).value||'1'),
              size:(document.getElementById('imgSize')||{}).value||'2656x1504',
              steps:parseInt((document.getElementById('imgSteps')||{}).value||'8'),
              seed:(document.getElementById('imgSeed')||{}).value||null};
  const size=body.size.split('x'); body.width=parseInt(size[0]); body.height=parseInt(size[1]);
  const r=await fetch('/api/img/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

function sizeOptions(cur){

async function agentPick(id){

async function saveAgentCfg(){
  const agent=(document.getElementById('agentSel')||{}).value||'';
  const model=(document.getElementById('agentModel')||{}).value||'';
  const r=await fetch('/api/agent/config',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({agent,model})});
  const j=await r.json(); if(!r.ok) return toast(j.error||'保存失败');
  AGCFG=j; toast('已保存 Agent：'+agent+' / '+model); render();
}

async function loadFlow(scene, force, episode){
  const ep = normEp(episode);   // 注意：不从上次结果继承，否则换场次后集号不更新
  if(!force && FLOW.data && FLOW.scene===scene && (FLOW.episode||'')===(ep||'')) return FLOW.data;
  FLOW.loading = true;
  try{
    const ctl = new AbortController();
    const timer = setTimeout(()=>ctl.abort(), 20000);
    const q = '/api/workflow/steps?scene='+encodeURIComponent(scene)+(ep?'&episode='+encodeURIComponent(ep):'');
    const r = await fetch(q, {signal: ctl.signal});
    clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP '+r.status);
    FLOW.data = await r.json(); FLOW.scene = scene; FLOW.episode = normEp(FLOW.data.episode) || ep || null;
    FLOW.failAt = 0;
  }
  catch(e){
    FLOW.data={steps:[],episodes:[],error:String(e)};
    FLOW.scene = scene; FLOW.episode = ep || null;
    FLOW.failAt = Date.now();          // 失败也记住位置，避免每次 render 都重试
  }
  FLOW.loading = false;
  return FLOW.data;
}

function flowStatus(st){
  const [cls,label] = FLOW_STATUS[st.status] || ['b-mut', st.statusText||st.status];
  return `<span class="badge ${cls}" style="font-size:10px">${label}</span>`;
}

function copyFlow(key, btn){
  const st=(FLOW.data&&FLOW.data.steps||[]).find(x=>x.key===key);
  if(!st) return toast('没有提示词');
  const done = ()=>toast('已复制 '+key+' 提示词');
  if(navigator.clipboard) navigator.clipboard.writeText(st.prompt).then(done, ()=>toast('复制失败'));
  else { const t=document.createElement('textarea'); t.value=st.prompt; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); done(); }
}

async function registerFlow(key){
  const st=(FLOW.data&&FLOW.data.steps||[]).find(x=>x.key===key) || {};
  if(!(st.newFiles||[]).length) return toast('没有未登记的新文件：先让 Agent 写下一版');
  const body={step:key, scene:FLOW.scene||'N001', episode:normEp(FLOW.episode)||normEp(state.ep)};
  const fs=document.getElementById('flow-file-'+key);
  if(fs && fs.value) body.path=fs.value;
  const sel=document.getElementById('flow-outcome-'+key);
  if(sel) body.outcome=sel.value;
  const r=await fetch('/api/workflow/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  if(!r.ok) return toast(j.error||'登记失败');
  toast('已登记：'+(j.path||key));
  FLOW.data=null; STG.data=null;
  await loadFlow(FLOW.scene||'N001', true); await loadStages(true); render();
}

async function confirmFlow(key){
  const st=(FLOW.data&&FLOW.data.steps||[]).find(x=>x.key===key) || {};
  const drafts=(st.versions||[]).filter(v=>v.statusText==='草稿待确认');
  if(!drafts.length) return toast('没有待确认草稿');
  const sel=document.getElementById('flow-conf-'+key);
  const path=sel?sel.value:drafts[0].path;
  if(!window.confirm('确认 '+(st.name||key)+' 的 '+path+'？\n确认后它会成为当前版本，旧版保留，下游可能被标记待复核。')) return;
  const r=await fetch('/api/workflow/confirm',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({step:key, scene:FLOW.scene||'N001', path, episode:normEp(FLOW.episode)||normEp(state.ep)})});
  const j=await r.json();
  if(!r.ok) return toast(j.error||'确认失败');
  toast('已确认：'+(j.path||key));
  FLOW.data=null; STG.data=null;
  await loadFlow(FLOW.scene||'N001', true); await loadStages(true); render();
}

async function dispatchFlow(key){
  const r=await fetch('/api/agent/dispatch',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({step:key,scene:FLOW.scene||'N001',episode:normEp(FLOW.episode)||normEp(state.ep)})});
  const j=await r.json(); if(!r.ok) return toast(j.error||'派发失败');
  if(j.started) toast('已派给 Agent：'+j.task.id+'（'+(j.task.agent||'')+' / '+(j.task.model||'')+'）');
  else if(j.reason) toast('未启动：'+j.reason);
  else toast('任务单已生成（未配置 Agent）：'+j.task.promptFile);
  FLOW.data=null; await loadFlow(FLOW.scene||'N001',true); render();
}

async function returnFlow(key){
  const note=prompt('退回修改的原因（会写进流程记录）：');
  if(note===null) return;
  const r=await fetch('/api/workflow/return',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({step:key,scene:FLOW.scene||'N001',note,episode:normEp(FLOW.episode)||normEp(state.ep)})});
  const j=await r.json(); if(!r.ok) return toast(j.error||'退回失败');
  toast('已记录退回：'+(j.record?.note||''));
  FLOW.data=null; await loadFlow(FLOW.scene||'N001',true); render();
}
async function batchFlow(action){
  if(!window.confirm((action==='register'?'登记所有阶段的新文件':'确认所有待确认草稿')+'？\n会逐个调用登记/确认，失败项会保留。')) return;
  const r=await fetch('/api/workflow/batch',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action,scene:FLOW.scene||'N001'})});
  const j=await r.json(); if(!r.ok) return toast(j.error||'批量操作失败');
  const ok=(j.results||[]).filter(x=>x.ok).length, bad=(j.results||[]).filter(x=>!x.ok).length;
  toast(`批量${action==='register'?'登记':'确认'}：成功 ${ok}，失败 ${bad}`);
  FLOW.data=null; STG.data=null; await loadFlow(FLOW.scene||'N001',true); await loadStages(true); render();
}

async function skipFlow(key){

/* 成果名称显示：去掉阶段号，长的收敛成短名（登记表里的 kind 不动，避免影响校验） */
const ART_ALIAS = {
  "剧本深度融合": "剧本",
  "成稿时长复核": "时长复核",
  "小说改编对账": "小说对账",
  "生产拆解": "生产拆解",
  "Lira 图像资产": "图像资产",
  "ACTING 表演设计": "表演设计",
  "镜头与视频提示词": "镜头与视频提示词",
};
function artName(kind){
  let k = String(kind||"").trim();
  k = k.replace(/^\d{2}[a-z]?\s+/, "");                 // 去掉 "05 " / "09a "
  for (const [long, short] of Object.entries(ART_ALIAS)){
    if (k.startsWith(long)) { k = short + k.slice(long.length); break; }
  }
  return k || String(kind||"");
}

function artFamily(p){ return String(p||'').replace(/-v\d{3}(?:-\d+)?\.md$/, ''); }
function artVersion(a){ const m=/-v(\d{3})(?:-\d+)?\.md$/.exec(a.path||''); return m?parseInt(m[1],10):0; }
function artVersionLabel(a){ return 'v'+String(artVersion(a)).padStart(3,'0')+' · '+artName(a.kind)+' · '+(ART_LABEL[a.status]||a.status); }
function artPick(fam,path){ ART_PICK[fam]=path; render(); }
function artGrouped(items){
  const g={};
  (items||[]).forEach(a=>{ const f=artFamily(a.path); (g[f]||(g[f]=[])).push(a); });
  return Object.keys(g).map(f=>{
    const vs=g[f].slice().sort((a,b)=>artVersion(b)-artVersion(a));
    const conf=vs.find(a=>a.status==='confirmed');
    const drafts=vs.filter(a=>a.status==='draft');
    let sel=vs.find(a=>a.path===ART_PICK[f]);
    if(!sel) sel=conf||drafts[0]||vs[0];
    return {family:f, versions:vs, selected:sel, confirmed:conf, drafts};
  });
}
function artPicker(g){
  if(g.versions.length<2) return '';
  return `<select onchange="artPick('${esc(g.family)}',this.value)" title="先选版本，再确认"
    style="background:#0f1216;border:1px solid var(--line);color:#c9d2e0;border-radius:5px;padding:2px 5px;font-size:10.5px;max-width:220px;margin-left:6px">
    ${g.versions.map(a=>`<option value="${esc(a.path)}" ${a.path===g.selected.path?'selected':''}>${esc(artVersionLabel(a))}</option>`).join('')}
  </select>`;
}

async function confirmArt(path, verdict){
  const d = STG.data;
  const art = (d.artifacts||[]).find(a=>a.path===path);
  const r = await fetch('/api/artifact/confirm', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({path, verdict, kind:art?art.kind:"", scope:art?art.scope:"", stage:art?art.stage:""})});
  const j = await r.json();
  if(!r.ok) return toast(j.error||"记录失败");
  ART_PICK[artFamily(path)] = path;
  toast(verdict==='pass' ? ((j.flow && !j.flow.already) ? ("已确认并登记："+path) : ("已确认："+path)) : ("已退回："+path));
  await loadStages(true);
  if(typeof GEN !== 'undefined' && GEN.scene){ await loadGen(GEN.scene, true); }
  render();
}

function epsTable(){

  const rows = wfs.map(wf=>{

      <td class="mono" style="color:${cur?'var(--acc)':'var(--dim)'}">${wf.episode}</td>

        ? '<span class="badge b-ok">完成</span>'

        : '<span class="badge b-mut">仅大纲</span>'}</td>

  const started = wfs.filter(w=>w.exists).length;

        <th style="width:96px"></th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function setV(id,v){ setU("scene",id,v); }
function draftOf(type,id){ return (state.drafts||{})[type+"::"+id] || ""; }
function setDraft(type,id,v){ state.drafts=state.drafts||{}; state.drafts[type+"::"+id]=v; }
function setU(type,id,v){
  vset(type,id,v);
  const gate = type==="shot" ? 2 : 1;
  const note = draftOf(type,id).trim();
  const body = {gate, unit:{type, id}, verdict:v,
    notes: note ? [{anchor:"", text:note.trim()}] : [],
    scope:{covers:[id], excludes:["其余单元","生成授权"]}};
  render();
  return fetch("/api/decision",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)})
    .then(r=>r.json())
    .then(j=>{
      if(j.ok){ setDraft(type,id,""); toast(`已落账 ${j.record.id} · ${({pass:"通过",revise:"需修改",hold:"待定"})[v]}`); render(); }
      else toast("落账失败："+(j.error||""));
    })
    .catch(e=>toast("落账失败："+e.message));
}

/* ---------- 审核一 · 资产 ---------- */
function galleryHtml(){
  const files = IMGST.files || [];
  if(!files.length) return "";
  const groups = {};
  files.forEach(f=>{ (groups[f.asset] = groups[f.asset] || []).push(f); });
  const blocks = Object.entries(groups).map(([asset, list])=>{
    const adopted = (IMGST.adopted||{})[asset];
    const label = asset.replace(/^IMG-\d+-/, "");
    return `<div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <b style="font-size:12.5px">${esc(label)}</b>
        <span class="mono dim" style="font-size:10.5px">${esc(asset)}</span>
        <span class="dim" style="font-size:11px">${list.length} 张</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">
        ${list.map(f=>{
          const on = adopted && adopted.file === f.file;
          return `<div style="border:1px solid ${on?'var(--ok)':'var(--line)'};border-radius:8px;overflow:hidden;background:var(--panel)">
            <img src="/api/img/file?p=${encodeURIComponent(f.file)}" style="width:100%;display:block;cursor:zoom-in"
                 onclick="openZoom('/api/img/file?p=${encodeURIComponent(f.file)}')">
            <div style="padding:7px 9px;display:flex;align-items:center;gap:6px">
              <span class="mono dim" style="font-size:10px;flex:1">${esc((f.file||"").split("/").pop())}</span>
              ${on?`<button class="btn ghost" style="font-size:10.5px;padding:2px 8px" onclick="adoptImg('${esc(asset)}',null)">取消采用</button>`
                 :`<button class="btn ghost" style="font-size:10.5px;padding:2px 8px" onclick="adoptImg('${esc(asset)}','${esc(f.file)}')">采用</button>`}
            </div></div>`;
        }).join("")}
      </div></div>`;
  }).join("");
  return `<div class="panel" style="margin-top:14px">
    <div class="ph"><span>已生成候选图</span><span class="dim">点图放大，滚轮继续缩放；采用后进入设定</span></div>
    <div class="pb">${blocks}</div></div>`;
}

/* ---------- 审核二 · 分镜墙 ---------- */
function sR2(){
  if(!D.shots || !D.shots.length) return emptyPanel("r2");
  const groups = D.scenes.map(sc=>{
    let list = D.shots.filter(s=>s.scene===sc.id);
    if(state.filter==="broken") list=list.filter(s=>s.broken.length);
    if(state.filter==="noprompt") list=list.filter(s=>!s.motion);
    if(state.filter==="short") list=list.filter(s=>s.short);
    if(state.filter==="pending") list=list.filter(s=>!vget("shot",s.id));
    if(state.filter==="judged") list=list.filter(s=>!!vget("shot",s.id));
    if(state.filter==="revise") list=list.filter(s=>vget("shot",s.id)==="revise");
    if(state.filter==="picked") list=list.filter(s=>!!selOf(s.id));
    if(!list.length) return "";
    const cells = list.map(s=>{
      const sid = s.id.replace("SHOT-EP002-","");
      const badges=[
        s.broken.length?`<span class="badge b-bad">断链</span>`:"",
        s.short?`<span class="badge b-warn">短</span>`:"",
        !s.motion?`<span class="badge b-mut">无词</span>`:`<span class="badge b-acc">有词</span>`,
        D.chain[s.id]?`<span class="badge b-draft">链</span>`:"",
        selBadge(s.id)
      ].join("");
      const fr = (s.fields["景别/机位"]||"").split(/[，,。；]/)[0].slice(0,14);
      const chainStyle = D.chain[s.id] ? "border-left:3px solid var(--draft)" : "";
      return `<div class="cell" style="${chainStyle}" title="${esc(s.fields["景别/机位"]||"")}"
        onclick="go('shot',{shot:'${s.id}'})">
        <div class="noimg"></div>
        <div class="ci">
          <div class="cid">${sid}</div>
          <div class="cd">${s.dur}<small>s</small></div>
          <div class="dim" style="font-size:10.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(fr)}</div>
          <div class="cb">${badges}</div>
        </div></div>`;
    }).join("");
    return `<div class="sect">${sc.id} · ${esc(sc.place)} <span class="dim">${list.length} 镜 · ${list.reduce((a,b)=>a+b.dur,0)}s</span></div>
      <div class="wall" style="margin-bottom:18px">${cells}</div>`;
  }).join("");

  const f=(k,label)=>`<div class="chip ${state.filter===k?'on':''}" onclick="go('r2',{filter:'${k}'})">${label}</div>`;
  return `
  <div class="chips">
    ${f("all","全部 90")}${f("pending",`未审 ${D.shots.filter(s=>!vget("shot",s.id)).length}`)}
    ${f("judged",`已判 ${D.shots.filter(s=>vget("shot",s.id)).length}`)}
    ${f("revise",`需修改 ${D.shots.filter(s=>vget("shot",s.id)==="revise").length}`)}
    ${f("picked",`已选 ${D.shots.filter(s=>!!selOf(s.id)).length}`)}
    ${f("noprompt",`无提示词 ${S.shots-S.promptShots}`)}${f("short",`短镜 ${S.shortShots.length}`)}
  </div>
  ${groups||'<div class="dim">没有符合条件的镜头</div>'}`;
}

/* ---------- 单镜 ---------- */
