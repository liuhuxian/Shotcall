<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>导演工作台 · 原型 v0.1</title>
<style>
:root{
  --bg:#0c0e11; --panel:#14171c; --panel2:#191d24; --line:#242a33;
  --tx:#e7eaf0; --mut:#8b93a3; --dim:#5c6474;
  --acc:#4a9eff; --ok:#3ecf8e; --warn:#f5a524; --bad:#f05252; --draft:#a78bfa;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c333d;border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

.banner{background:linear-gradient(90deg,#1b2230,#141a24);border-bottom:1px solid var(--line);
  padding:7px 18px;font-size:12px;color:var(--mut);display:flex;gap:14px;align-items:center}
.banner b{color:var(--warn);font-weight:600}
header{display:flex;align-items:center;gap:16px;padding:14px 20px 0}
h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
.sub{color:var(--dim);font-size:12px}
nav{display:flex;gap:2px;padding:12px 20px 0;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{padding:9px 14px;border-radius:8px 8px 0 0;color:var(--mut);font-size:13px;white-space:nowrap;border:1px solid transparent;border-bottom:none}
nav button:hover{color:var(--tx);background:var(--panel)}
nav button.on{color:var(--tx);background:var(--panel);border-color:var(--line);position:relative;top:1px}
nav button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-left:6px;vertical-align:1px}

main{padding:18px 20px 60px;max-width:1560px;margin:0 auto}
.epsel{position:relative;display:inline-block}
.epbtn{display:flex;align-items:center;gap:7px;padding:2px 7px 2px 0;border:none;
  background:none;font-size:12.5px;color:var(--mut);border-radius:6px}
.epbtn:hover{color:var(--tx)}
.epbtn:hover .cur{text-decoration:underline;text-underline-offset:3px}
.epbtn .proj{color:var(--dim)}
.epbtn .sep{color:var(--dim)}
.epbtn .cur{color:var(--tx)}
.epbtn .car{color:var(--dim);font-size:10px;margin-left:1px}
.st{width:7px;height:7px;border-radius:50%;flex-shrink:0;display:inline-block}
.epmenu{position:absolute;left:0;top:calc(100% + 8px);width:330px;max-height:430px;overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:40;
  box-shadow:0 16px 40px rgba(0,0,0,.55);padding:5px}
.epitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12.5px}
.epitem:hover{background:var(--panel2)}
.epitem.on{background:#1b2430}
.epitem .n{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim);min-width:42px}
.epitem.on .n{color:var(--acc)}
.epitem .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epitem .s{font-size:10.5px;color:var(--dim)}
.muted{color:var(--mut)} .dim{color:var(--dim)} .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.badge{display:inline-block;padding:1px 7px;border-radius:20px;font-size:11px;line-height:18px;border:1px solid}
.b-ok{color:var(--ok);border-color:#1e5b43;background:#0f2a20}
.b-warn{color:var(--warn);border-color:#5c421a;background:#2a1f0d}
.b-bad{color:var(--bad);border-color:#5c2323;background:#2a1212}
.b-mut{color:var(--mut);border-color:var(--line);background:#12151a}
.b-acc{color:var(--acc);border-color:#1c3f66;background:#0f1c2b}
.b-draft{color:var(--draft);border-color:#3b2f63;background:#1a1630}

.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi{font-size:26px;font-weight:600;letter-spacing:.5px}
.kpi small{font-size:12px;color:var(--mut);font-weight:400;margin-left:4px}

.row{display:flex;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.ph{padding:9px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut);
  display:flex;justify-content:space-between;align-items:center;letter-spacing:.4px}
.pb{padding:12px 14px}

list,.bare{list-style:none;margin:0;padding:0}
.sitem{padding:9px 12px;border-bottom:1px solid #1b2028;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.sitem:hover{background:var(--panel2)}
.sitem.on{background:#1b2430;box-shadow:inset 3px 0 0 var(--acc)}
.sitem .n{font-size:11px;color:var(--dim);min-width:26px;font-family:ui-monospace,monospace}
.sitem .t{flex:1;min-width:0}
.sitem .t div:first-child{font-size:13px}
.sitem .t div:last-child{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.read{max-width:640px;font-size:15px;line-height:1.85}
.read .act{color:#cfd6e2;margin:0 0 14px}
.read .line{display:flex;gap:10px;margin:0 0 9px;padding:5px 10px;border-radius:6px;cursor:text}
.read .line:hover{background:#161a21}
.read .spk{color:var(--acc);min-width:44px;flex-shrink:0;font-size:13px;padding-top:2px}
.read .spk.q{color:#e0a458}
.read .spk.w{color:#b98cd6}
.read .txt{color:#eef1f6}
.read .line:hover::after{content:"＋意见";font-size:11px;color:var(--dim);align-self:center;margin-left:auto}

.kv{display:grid;grid-template-columns:76px 1fr;gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--dim)} .kv dd{margin:0;color:#cbd3df}

.verdict{display:flex;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);background:#101318}
.btn{padding:7px 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);font-size:13px}
.btn:hover{border-color:#38414e}
.btn.ok{color:#0b1a12;background:var(--ok);border-color:var(--ok);font-weight:600}
.btn.warn{color:#241703;background:var(--warn);border-color:var(--warn);font-weight:600}
.btn.acc{color:#04121f;background:var(--acc);border-color:var(--acc);font-weight:600}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.42;cursor:not-allowed}

.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
.cell:hover{border-color:#3a4655;transform:translateY(-1px)}
.cell .ci{padding:8px 9px 7px}
.cell .cid{font-size:11px;font-family:ui-monospace,monospace;color:#aab3c2;letter-spacing:.2px}
.cell .cd{font-size:17px;font-weight:600;line-height:1.25}
.cell .cd small{font-size:11px;color:var(--dim);font-weight:400}
.cell .cb{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.cell .noimg{height:34px;background:repeating-linear-gradient(45deg,#12151a,#12151a 6px,#161b22 6px,#161b22 12px);border-bottom:1px solid var(--line)}
.sect{margin:0 0 10px;font-size:12px;color:var(--mut);display:flex;gap:10px;align-items:center;letter-spacing:.4px}
.sect:before{content:"";width:3px;height:12px;background:var(--acc);border-radius:2px}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:5px 11px;border-radius:20px;border:1px solid var(--line);font-size:12px;color:var(--mut);cursor:pointer}
.chip.on{color:var(--tx);border-color:#3a4a5e;background:#1b2430}

.refrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #1b2028}
.refrow img{width:72px;height:48px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.miss{width:72px;height:48px;border-radius:5px;border:1px dashed #5c2323;background:#1e1212;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--bad);text-align:center;line-height:1.3}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;color:var(--mut);font-weight:500;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #1b2028;vertical-align:top}
tr:hover td{background:#12161c}

.cand{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1;min-width:0}
.cand .poster{position:relative;aspect-ratio:16/10;background:#000}
.cand .poster img{width:100%;height:100%;object-fit:cover;opacity:.92}
.cand .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.cand .play span{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);
  display:flex;align-items:center;justify-content:center;font-size:15px}
.cand .meta{padding:10px 12px;font-size:12px;color:var(--mut)}
.cand.sel{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.cand .acts{display:flex;gap:6px;padding:0 12px 12px}
.cand .acts .btn{flex:1;padding:6px 0;text-align:center;font-size:12.5px}

.modal{position:fixed;inset:0;background:rgba(4,6,9,.72);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1d2531;border:1px solid #33415a;
  padding:10px 18px;border-radius:8px;font-size:13px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.5)}

.alert{display:flex;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);margin-bottom:8px;cursor:pointer}
.alert:hover{border-color:#3a4655}
.alert .ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.bar{height:6px;background:#1d222a;border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.bar.ok i{background:var(--ok)}
</style>
</head>
<body>
<div class="banner">
  <span><b>静态原型</b> · 只读演示</span>
  <span>数据<b>真实</b>（从项目文件解析）</span>
  <span>交互为<b>模拟</b>，不会保存任何修改</span>
  <span style="margin-left:auto" class="dim" id="bannerStat"></span>
</div>
<header>
  <div>
    <h1>导演工作台</h1>
    <div class="epsel" id="epsel"></div>
  </div>
</header>
<nav id="nav"></nav>
<main id="app"></main>
<div id="toastHost"></div>

<script>
const D = __DATA__;
const IMG = __IMG_JSON__;
const S = D.stats;

/* ---- 原型内的模拟状态（仅内存） ---- */
const state = {
  tab:"stages", ep:"EP002", scene:D.scenes[0].id, shot:"SHOT-EP002-SC001-03A",
  filter:"all", verdicts:{}, picks:{}, candModal:null, batchModal:null, reasonChips:[], drafts:{}, preflight:null, plan:null, exec:null
};
const vkey=(t,id)=>t+"::"+id;
const vget=(t,id)=>state.verdicts[vkey(t,id)];
const vset=(t,id,v)=>{ state.verdicts[vkey(t,id)]=v; };

const SPKCLASS = {"陈铭":"", "秦淮":"q", "妻子":"w"};
const mmss = sec => {
  if(sec==null || isNaN(sec)) return "—";
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return m + ":" + String(s).padStart(2,"0");
};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = n => (n>=60 ? (n/60).toFixed(1)+" 分" : n+" 秒");
const shotById = id => D.shots.find(s=>s.id===id);
const sceneById = id => D.scenes.find(s=>s.id===id);

function toast(msg){
  const h=document.getElementById("toastHost");
  h.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(window.__t); window.__t=setTimeout(()=>h.innerHTML="",2200);
}
function tryAssetGen(name){
  const hasPrompt = !!(D.files||{})["图片提示词.md"];
  if (!hasPrompt) {
    toast("还不能出图：本集缺 图片提示词.md（工作流第 08 步）");
    return;
  }
  toast("候选 = 同一提示词出 4 个变体，挑一张采用；生成入口在下方批次单");
}

function go(tab, opts){
  Object.assign(state, opts||{}, {tab});
  if(tab === 'backend'){
    BK.data = null;                       // 先清空，避免显示旧快照
    render();
    loadBackend(true).then(()=>render());
    return;
  }
  render();
}

/* ---------- 通用组件 ---------- */
function selOf(shotId){
  return (D.selections||[]).find(s=>s.shot===shotId) || null;
}
function selBadge(shotId){
  const s=selOf(shotId);
  if(!s) return "";
  if(s.status==="adopt") return '<span class="badge b-ok">已采用</span>';
  if(s.status==="backup") return '<span class="badge b-acc">备选</span>';
  return '<span class="badge b-warn">重做</span>';
}
function staleOf(type,id){
  const d=(D.decisions||[]).find(x=>x.unit.type===type&&x.unit.id===id);
  return d&&d.stale ? (d.staleFiles||[]) : null;
}
function staleBadge(type,id){
  const f=staleOf(type,id);
  return f?`<span class="badge b-warn" title="依据文件已变更：${esc(f.join("、"))}">文件已变更·需复核</span>`:"";
}
function verdictBadge(v){
  if(v==="pass") return `<span class="badge b-ok">通过</span>`;
  if(v==="revise") return `<span class="badge b-warn">需修改</span>`;
  if(v==="hold") return `<span class="badge b-mut">待定</span>`;
  return `<span class="badge b-mut" style="opacity:.65">未审</span>`;
}

function reviewDot(tab){
  if(!D || !D.workflow) return "";
  const wf = D.workflow.find(w=>w.episode===D.episode);
  if(!wf) return "";
  const keyMap = {r1:"review1", r1a:"review2", r2:"review3", pick:"review4"};
  const key = keyMap[tab]; if(!key) return "";
  const idx = wf.steps.findIndex(s=>s.key===key);
  if(idx < 0) return "";
  const st = wf.steps[idx];
  let color, tip;
  if(st.status === "done"){ color = "var(--ok)"; tip = "已完成"; }
  else {
    color = st.ready ? "var(--warn)" : "#3a4655";
    tip = st.ready ? "可以审，尚未审完" : "还没到这一步";
  }
  return `<i class="dot" title="${tip}" style="background:${color};margin-left:6px"></i>`;
}

function nav(){
  const items=[
    ["stages","阶段看板"],["scenes","场次"],["assets","资产"],["shots","镜头"],
    ["gen","生成台"],["backend","算力"],["pending","待确认"],["verify","校验"]];
  document.getElementById("nav").innerHTML = items.map(([k,label])=>{
    const dot = reviewDot(k);
    return `<button class="${state.tab===k?'on':''}" onclick="go('${k}')">${label}${dot}</button>`;
  }).join("");
}

const TAB_LABEL = {backend:"算力", stages:"阶段看板", scenes:"场次", gen:"生成台", assets:"资产", shots:"镜头", stage:"阶段详情", pending:"待确认", arts:"成果清单", verify:"校验", legacy:"旧界面", overview:"总览", workflow:"工作流", dev:"开发", r1:"审核一 · 剧本", r1a:"审核二 · 资产",
  r2:"审核三 · 分镜", shot:"单镜详情", checks:"检查", pick:"审核四 · 挑片", batch:"视频生成",
  img:"出图 · 资产", img2:"出图 · 分镜", export:"修改单"};

function emptyPanel(key){
  const label = TAB_LABEL[key] || key;
  return `<div class="panel" style="max-width:760px">
    <div class="ph"><span><b>${esc(state.ep)}</b> · ${esc(label)}</span><span class="badge b-mut">空白</span></div>
    <div class="pb">
      <div class="dim" style="font-size:13px;line-height:1.9">
        本集还没有对应的创作文档，所以这一页是空的。<br>
        这不是加载失败，也不是卡住——${esc(state.ep)} 目前只有大纲。
      </div>
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn acc" onclick="go('workflow')">看这一集的流程</button>
        <button class="btn ghost" onclick="go('overview')">回全剧总览</button>
      </div>
      <div class="dim mono" style="font-size:11px;margin-top:16px">当前页面：${esc(key)}</div>
    </div></div>`;
}

/* ---------- 开发（原著拆解 · 人物圣经 · 分集大纲） ---------- */
function sDev(){
  const dv = D.dev || {};
  const sa = dv.sourceAnalysis || {files:[]};
  const bb = dv.bible || {characters:[], totalEvidence:0};
  const eps = D.episodes||[];

  const files = (sa.files||[]).map(f=>`<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid #1b2028">
    <span style="font-size:12.5px">${esc(f.name)}</span><span class="dim mono" style="font-size:11px">${f.kb} KB</span></div>`).join("");

  const chars = (bb.characters||[]).map(c=>`<div style="display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #1b2028">
    <span style="min-width:56px;font-size:13px">${esc(c.name)}</span>
    <span class="dim" style="flex:1;font-size:11.5px">${esc(c.desc||"")}</span>
    <span class="badge b-acc">${c.evidence} 条</span></div>`).join("");

  const rows = eps.map(e=>`<tr style="cursor:pointer" onclick="pickEp('${e.id}')">
    <td class="mono" style="color:${e.id===state.ep?'var(--acc)':'var(--dim)'}">${e.id}</td>
    <td>${esc(e.title)}</td>
    <td class="dim" style="text-align:center">${e.chapters?e.chapters[0]+"–"+e.chapters[1]:"—"}</td>
    <td class="dim mono" style="text-align:center">${mmss(e.target)}</td></tr>`).join("");

  return `
  <div class="grid4" style="margin-bottom:14px">
    <div class="card"><div class="muted" style="font-size:12px">拆解文件</div><div class="kpi">${(sa.files||[]).length}<small>份</small></div></div>
    <div class="card"><div class="muted" style="font-size:12px">人物分册</div><div class="kpi">${(bb.characters||[]).length}<small>位</small></div></div>
    <div class="card"><div class="muted" style="font-size:12px">原文证据</div><div class="kpi">${bb.totalEvidence||0}<small>条</small></div></div>
    <div class="card"><div class="muted" style="font-size:12px">分集</div><div class="kpi">${eps.length}<small>集</small></div></div>
  </div>

  <div class="row" style="gap:14px;align-items:flex-start;margin-bottom:14px">
    <div class="panel" style="width:46%">
      <div class="ph"><span>原著拆解</span><span class="dim">项目开发/source-analysis/</span></div>
      <div class="pb">${files || '<div class="dim">尚未拆解</div>'}</div>
    </div>
    <div class="panel grow">
      <div class="ph"><span>人物圣经</span><span class="dim">novel-analyzer · 每条带原文行号</span></div>
      <div class="pb">
        ${chars || '<div class="dim">尚未生成人物圣经</div>'}
        ${(bb.minor||[]).length?`<div class="dim" style="font-size:11.5px;margin-top:8px">次要人物：${(bb.minor||[]).map(esc).join("、")}</div>`:""}
        ${bb.world?`<div class="dim" style="font-size:11.5px;margin-top:6px">世界设定：${esc(bb.world)}</div>`:""}
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="ph"><span>分集大纲</span><span class="dim">${eps.length} 集 · 点击行切换集</span></div>
    <table>
      <thead><tr><th style="width:70px">集</th><th>集名</th>
        <th style="width:80px;text-align:center">原著</th><th style="width:70px;text-align:center">目标</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="dim">尚无分集大纲</td></tr>'}</tbody>
    </table>
  </div>`;
}

/* ---------- 工作流 ---------- */
function sWorkflow(){
  const wf = (D.workflow||[]).find(x=>x.episode===state.ep);
  if(!wf) return `<div class="panel"><div class="pb dim">没有这一集的流程数据。</div></div>`;
  const S2 = {
    done:['b-ok','已完成'], progress:['b-acc','进行中'], manual:['b-acc','随文档写入'], pending:['b-mut','未开始']
  };
  const gates = {"review1":1,"review2":1,"batch":1,"gen1":1,"gen2":1,"test":1};
  const rows = wf.steps.map(s=>{
    const [cls,label] = S2[s.status]||S2.pending;
    const isGate = gates[s.key];
    return `<div style="display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-bottom:1px solid #1b2028;

      <div class="mono dim" style="min-width:22px;font-size:12px;padding-top:1px">${String(s.no).padStart(2,"0")}</div>

        <div class="dim mono" style="font-size:11px;margin-top:2px">${esc(s.skill||"")}</div>
        ${s.note?`<div class="dim" style="font-size:11.5px;margin-top:2px">${esc(s.note)}</div>`:""}
        ${s.basis?`<div class="mono" style="font-size:10.5px;color:#5c6474;margin-top:3px">${s.status==="done"?"✓":"·"} ${esc(s.basis)}</div>`:""}
        ${s.prompt?`<details style="margin-top:7px">
          <summary class="dim" style="font-size:11.5px;cursor:pointer;user-select:none">提示词模板</summary>
          <div style="display:flex;gap:8px;align-items:flex-start;margin-top:6px">
            <pre class="mono" style="flex:1;white-space:pre-wrap;font-size:11px;line-height:1.7;background:#0f1216;
              border:1px solid var(--line);border-radius:6px;padding:9px 11px;margin:0;color:#c9d2e0">${esc(s.prompt)}</pre>
            <button class="btn ghost" style="font-size:11.5px;padding:4px 10px;flex-shrink:0" onclick="copyPrompt(this)">复制</button>
          </div>
        </details>`:""}
      </div>
      <div style="text-align:right;flex-shrink:0">
        <span class="badge ${cls}">${label}</span>
        ${s.detail?`<div class="dim" style="font-size:11px;margin-top:4px">${esc(s.detail)}</div>`:""}
      </div>
    </div>`;
  }).join("");
  const done = wf.steps.filter(s=>s.status==="done").length;
  return `
  ${wf.titleMismatch?`<div class="alert" style="margin-bottom:14px;border-color:#5c2323;background:#1d1212;cursor:default">

    <div><b>目录内容与新大纲不一致</b>
      <div class="dim" style="font-size:12.5px;margin-top:3px">
        大纲第 ${wf.episode} 集是《${esc(wf.mapTitle||"")}》，但 剧集/${wf.episode}/剧本.md 写的是《${esc(wf.scriptTitle||"")}》。
        下面这些"已完成"来自旧编号，不能直接当作新大纲的进度。
      </div></div>
  </div>`:""}
  ${(window.__STATE_WARN?`<div class="alert" style="margin-bottom:14px;cursor:default;border-color:#5c4a1f;background:#1e1a10">
    <div class="ic" style="background:#2a2312;color:var(--warn)">!</div>
    <div><b>决策记录存在备选目录</b>
      <div class="dim" style="font-size:12px">${esc(window.__STATE_WARN)}</div></div>
  </div>`:"")}
  <div class="panel" style="margin-bottom:14px">

      <span class="dim">${done}/${wf.steps.length} 步完成${wf.exists?"":" · 本集尚未建立目录"}</span></div>
    <div class="pb dim" style="font-size:12px">
      写作由 DSH 技能产出文档；出图/出片由工作台批次授权后执行；两个蓝色节点是导演审核。
    </div>
    <div>${rows}</div>
  </div>`;
}

/* ---------- 算力 ---------- */
let BK = {data:null, xz:{}};   // xz: 二次确认缓存

async function loadBackend(force){
  if(BK.data && !force) return BK.data;
  try{ BK.data = await (await fetch('/api/backend')).json(); }catch(e){ BK.data = null; }
  return BK.data;
}

function confirmGate(key, label, fn){
  const now = Date.now();
  const armed = BK.xz[key] && BK.xz[key] > now;
  if(!armed){
    BK.xz[key] = now + 5000;
    render();
    toast("再点一次确认" + label + "（5 秒内有效）");
    return;
  }
  delete BK.xz[key];
  fn();
}

async function backendAction(card, action, label){
  const run = async ()=>{
    if(action === 'start'){ BK.starting = card; render(); }
    const r = await fetch('/api/backend/action', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({action, card})});
    const j = await r.json();
    if(!r.ok) return toast(j.error||"操作失败");
    BK.starting = null;
    toast(label + "：卡" + card + " 已执行");
    await loadBackend(true); render();
  };
  if(action === 'interrupt' || action === 'stop' || action === 'restart'){
    confirmGate(action+card, (action==='interrupt'?'中断':action==='stop'?'停止':'重启'), run);
  } else { run(); }
}

function cardColor(st){
  return st === 'free' ? 'var(--ok)' : st === 'busy' ? 'var(--warn)'
       : st === 'full' ? 'var(--bad)' : 'var(--dim)';
}

function cardsGrid(d){
  const cards = d.cards || [];
  const cells = cards.map(c=>{
    const color = cardColor(c.state);
    const inst = c.instance;
    const xz = (k)=>BK.xz[k] && BK.xz[k] > Date.now();
    const prog = inst && inst.progress && inst.progress.max
      ? Math.round(inst.progress.value / inst.progress.max * 100) : 0;
    return `<div style="border:1px solid ${color};border-radius:9px;background:var(--panel);padding:10px 12px">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:6px">
        <i class="dot" style="background:${color};width:8px;height:8px"></i>
        <b style="font-size:13px">卡 ${c.card}</b>
        <span class="dim mono" style="font-size:10.5px">:${c.port}</span>
        <span class="dim" style="margin-left:auto;font-size:10.5px">${c.hasInstance?'实例运行中':'未启动'}</span>
      </div>
      <div class="bar" style="margin:0 0 4px"><i style="width:${c.pct||0}%;background:${color}"></i></div>
      <div class="mono dim" style="font-size:10.5px;margin-bottom:8px">
        ${c.usedGB!=null ? c.usedGB+' / '+c.totalGB+' GB · '+c.pct+'%' : '显存读取失败'}
      </div>
      ${inst ? `
        <div class="mono dim" style="font-size:10px;margin-bottom:6px">
          pid ${inst.pid||'—'} · ComfyUI：${inst.queue?inst.queue.run:0} 在跑${(inst.queue&&inst.queue.pend)?` · ${inst.queue.pend} 已送达待跑`:''}
          ${inst.job?` · 当前 ${esc(inst.job.label)}`:''}
        </div>
        <div class="bar" style="margin:0 0 8px"><i style="width:${prog}%;background:var(--acc)"></i></div>
        ${(d.summary&&d.summary.pendingLocal)?`<div class="dim" style="font-size:10px;margin-bottom:6px;color:var(--warn)">全台还有 ${d.summary.pendingLocal} 项在等空闲卡</div>`:''}
        <div style="display:flex;gap:4px;flex-wrap:wrap">
          <button class="btn ghost" style="font-size:10.5px;padding:2px 8px" onclick="backendAction(${c.card},'interrupt','中断')">${xz('interrupt'+c.card)?'确认？':'中断'}</button>
          <button class="btn ghost" style="font-size:10.5px;padding:2px 8px" onclick="backendAction(${c.card},'clear','清空队列')">清队</button>
          <button class="btn ghost" style="font-size:10.5px;padding:2px 8px" onclick="backendAction(${c.card},'restart','重启')">${xz('restart'+c.card)?'确认？':'重启'}</button>
          <button class="btn warn" style="font-size:10.5px;padding:2px 8px" onclick="backendAction(${c.card},'stop','停止')">${xz('stop'+c.card)?'确认？':'停止'}</button>
        </div>` : `
        <button class="btn acc" style="font-size:11px;padding:3px 10px;width:100%"
          ${BK.starting===c.card?'disabled':''}
          onclick="backendAction(${c.card},'start','启动实例')">
          ${BK.starting===c.card?'启动中…':'启动实例'}</button>`}
    </div>`;
  }).join("");
  return `<div class="panel" style="margin-bottom:14px">
    <div class="ph"><span>显卡占用</span>
      <span class="dim">绿=空闲 · 橙=有占用 · 红=接近满载 · 手动启停，不自动扩缩</span></div>
    <div class="pb" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px">${cells}</div>
  </div>`;
}

function queueHtml(d){
  const jobs = d.jobs || [];
  if(!jobs.length) return `<div class="panel" style="margin-top:6px">
    <div class="ph"><span>生成队列</span><span class="dim">没有排队或运行中的任务</span></div></div>`;
  const now = Date.now()/1000;
  const rows = jobs.map((j,i)=>{
    const LABEL = {running:'生成中', waiting:'ComfyUI 排队', dispatched:'已派发', queued:'待派卡', aborted:'已中断'};
    const running = j.status === 'running';
    const wait = j.startedAt ? Math.round(now - j.startedAt) : (j.queuedAt ? Math.round(now - j.queuedAt) : 0);
    const color = running ? 'var(--acc)' : (j.status === 'waiting' ? 'var(--warn)' : 'var(--dim)');
    return `<tr style="border-left:2px solid ${color}">
      <td class="mono dim" style="width:34px">${i+1}</td>
      <td style="width:78px"><span class="badge ${running?'b-acc':(j.status==='waiting'?'b-warn':'b-mut')}" style="font-size:10px">${LABEL[j.status]||j.status}</span></td>
      <td class="mono" style="width:74px">${j.unit||'—'}${j.seq?` #${j.seq}`:''}</td>
      <td class="dim" style="width:56px">${j.kind==='video'?'视频':'图片'}</td>
      <td class="dim mono" style="width:70px">${j.card!=null?('卡'+j.card):'待分配'}</td>
      <td class="dim mono" style="width:80px">${j.seconds?j.seconds+'秒/'+j.frames+'帧':''}</td>
      <td class="dim" style="width:70px">${j.kind==='video'?(j.refs?('参考图 '+j.refs+' 张'):'无参考图'):'—'}</td>
      <td class="dim mono" style="width:92px">${running
        ? (j.execStartedAt ? '已用 '+Math.round((now-j.execStartedAt)/60)+' 分' : '刚开始')
        : '已等 '+Math.round((j.waitSec||0)/60)+' 分'}</td>
      <td class="dim mono" style="width:110px">${j.etaSec!=null?('约 '+Math.ceil(j.etaSec/60)+' 分后完成'):(j.totalSec?('预计 '+Math.round(j.totalSec/60)+' 分'):'—')}</td>
      <td class="dim mono" style="font-size:10.5px">${esc((j.id||'').slice(-22))}</td>
    </tr>`;
  }).join("");
  const run = jobs.filter(j=>j.status==='running').length;
  return `<div class="panel" style="margin-top:6px">
    <div class="ph"><span>生成队列</span><span class="dim">${jobs.length} 项 · 生成中 ${run} · 排队 ${jobs.length-run} · 预估按 ${d.ratePerFrame||6.8} 秒/帧（本机实测）</span></div>
    <div class="pb"><table><thead><tr><th>#</th><th>状态</th><th>单元</th><th>类型</th><th>卡</th><th>规格</th><th>参考</th><th>时间</th><th>预计</th><th>任务号</th></tr></thead>
      <tbody>${rows}</tbody></table></div></div>`;
}

function sBackend(){
  const d = BK.data;
  if(!d){ loadBackend().then(()=>render()); return `<div class="dim">读取算力…</div>`; }
  const s = d.summary||{};

  return `
  <div class="grid4" style="margin-bottom:14px">

    <div class="card"><div class="muted" style="font-size:12px">空闲可开卡</div><div class="kpi" style="color:var(--ok)">${free}</div></div>

}

/* ---------- 生成台 ---------- */
let GEN = {scene:null, units:[], results:[], jobs:[], draft:{}, poll:null};

async function loadGen(scene, force){
  if(GEN.scene===scene && !force && GEN.loaded) return;
  GEN.scene = scene;
  try{
    const [u, r, j] = await Promise.all([
      fetch('/api/gen/units?scene='+encodeURIComponent(scene)).then(x=>x.json()),
      fetch('/api/gen/results?scene='+encodeURIComponent(scene)).then(x=>x.json()),
      fetch('/api/gen/jobs').then(x=>x.json()),
    ]);
    GEN.units = u.units||[]; GEN.results = r.results||[]; GEN.jobs = j.jobs||[];
    GEN.resSig = JSON.stringify((r.results||[]).map(x=>[x.file, x.mtime]));
    GEN.loaded = true;
  }catch(e){ GEN.loaded = true; }
}

function genUnitRow(u){
  const mine = (GEN.results||[]).filter(r=>r.unit===u.id);
  const running = (GEN.jobs||[]).find(j=>j.unit===u.id && ['running','queued','starting'].includes(j.status));
  const picked = GEN.draft[u.id] !== false;
  return `<div style="border:1px solid var(--line);border-radius:9px;background:var(--panel);margin-bottom:10px">
    <div style="display:flex;align-items:center;gap:10px;padding:10px 13px">
      <input type="checkbox" ${picked?'checked':''} onchange="GEN.draft['${u.id}']=this.checked"
        style="width:15px;height:15px">
      <b class="mono" style="font-size:12.5px">${u.id}</b>
      <span class="dim" style="font-size:11.5px">${u.seconds} 秒 · ${esc(u.shots)}</span>
      <span class="dim" style="font-size:11px">${u.prompt.length} 字</span>
      <span class="dim" style="font-size:11px;margin-left:6px">次数</span>
      <input type="number" min="1" max="9" value="${(GEN.count||{})[u.id]||1}"
        onchange="GEN.count=GEN.count||{};GEN.count['${u.id}']=Math.max(1,Math.min(9,parseInt(this.value)||1))"
        style="width:52px;background:#0f1216;border:1px solid var(--line);color:#c9d2e0;border-radius:5px;padding:2px 6px;font-size:12px">
      ${running?`<span class="badge b-acc" style="font-size:10px">${running.status==='running'?'生成中':'排队'}</span>`:''}
      ${mine.length?`<span class="badge b-ok" style="font-size:10px">已有 ${mine.length} 条</span>`:''}
      <button class="btn ghost" style="margin-left:auto;font-size:11px;padding:3px 9px"
        onclick="GEN.open=GEN.open||{};GEN.open['${u.id}']=!GEN.open['${u.id}'];render()">
        ${GEN.open && GEN.open[u.id] ? '收起' : '审核稿'}</button>
    </div>
    ${(u.refs||[]).length?`<div style="padding:0 13px 12px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
      ${u.refs.map(r=>`<div style="width:120px">
        ${r.exists?`<img src="/api/proj/file?p=${encodeURIComponent(r.file)}" onclick="openZoom('/api/proj/file?p=${encodeURIComponent(r.file)}')"
            style="width:100%;height:74px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block">`
          :`<div style="height:74px;border-radius:6px;border:1px dashed var(--bad);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--bad)">缺图</div>`}
        <div class="mono dim" style="font-size:10px;margin-top:3px">Picture ${r.n}${(u.assetIds||[])[r.n-1]?' · '+esc(u.assetIds[r.n-1]):''}</div>
      </div>`).join("")}
    </div>`:''}
    ${GEN.open && GEN.open[u.id]?`<div style="padding:0 13px 12px">
      <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
        <button class="btn ghost" style="font-size:11px;padding:2px 9px;${(GEN.lang||{})[u.id]!=='en'?'border-color:var(--acc);color:var(--acc)':''}"
          onclick="GEN.lang=GEN.lang||{};GEN.lang['${u.id}']='zh';render()">中文审核稿</button>
        <button class="btn ghost" style="font-size:11px;padding:2px 9px;${(GEN.lang||{})[u.id]==='en'?'border-color:var(--acc);color:var(--acc)':''}"
          onclick="GEN.lang=GEN.lang||{};GEN.lang['${u.id}']='en';render()">英文原文</button>
        ${u.zhStale?'<span class="badge b-warn" style="font-size:10px">译文与原文不一致</span>':''}
      </div>
      <pre style="white-space:pre-wrap;line-height:1.85;font-size:${(GEN.lang||{})[u.id]==='en'?'11px':'12.5px'};
        background:#0f1216;border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0;
        color:#c9d2e0;max-height:300px;overflow:auto">${esc(((GEN.lang||{})[u.id]==='en' || !u.zh) ? u.prompt : u.zh)}</pre>
      ${!u.zh?'<div class="dim" style="font-size:11px;margin-top:4px">该单元还没有中文审核稿。</div>':''}

          style="width:100%;border-radius:6px;border:1px solid var(--line)"></video>
        <div class="mono dim" style="font-size:10px;margin-top:3px">#${idx+1} · ${esc(r.time||"")} · ${r.kb} KB</div>
      </div>`).join("")}</div>`:''}
  </div>`;
}

function sGen(){
  const d = SCN.data;

  state.scene = scene;
  if(GEN.scene !== scene || !GEN.loaded){ loadGen(scene).then(()=>render()); }
  const tabs = (d.scenes||[]).map(s=>`<span onclick="go('gen',{scene:'${s.id}'})" style="cursor:pointer;padding:4px 10px;border-radius:6px;font-size:11.5px;
    border:1px solid ${s.id===scene?'var(--acc)':'var(--line)'};color:${s.id===scene?'var(--acc)':'#8b95a6'}">${s.id}</span>`).join(" ");
  const units = GEN.units||[];

        <select onchange="GEN.size=this.value"
          style="background:#0f1216;border:1px solid var(--line);color:#c9d2e0;border-radius:5px;padding:4px 6px;font-size:12px">
          <option value="1216x672" ${(GEN.size||'1216x672')==='1216x672'?'selected':''}>1216×672（16:9 · 0.79）</option>
          <option value="1344x768" ${GEN.size==='1344x768'?'selected':''}>1344×768（16:9 · 0.98）</option>

        </select>
        <span class="dim" style="font-size:11.5px">步数</span>

        <button class="btn acc" ${picked.length?'':'disabled'} onclick="submitGen()">提交生成</button>

      </div>
    </div></div>`;
}

async function submitGen(){
  const units = (GEN.units||[]).filter(u=>GEN.draft[u.id]!==false)
    .map(u=>({id:u.id, count:(GEN.count||{})[u.id]||1}));
  if(!units.length) return toast("没有选中单元");
  const total = units.reduce((a,b)=>a+b.count,0);
  const seedRaw = String(GEN.seed||"").trim();
  const r = await fetch('/api/gen/submit', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({scene: GEN.scene, units, seed: seedRaw||null,
                          steps: GEN.steps||20, size: GEN.size||'1216x672'})});
  const j = await r.json();
  if(!r.ok) return toast(j.error||"提交失败");
  toast("已提交 "+j.jobs.length+" 条（共 "+total+" 次）：" + j.batch);
  setTimeout(()=>loadGen(GEN.scene,true).then(()=>render()), 3000);
}

function sVerify(){
  const d = STG.data;
  if(!d){ if(!STG.loading) loadStages().then(()=>render()); return `<div class="dim">读取中…</div>`; }
  const bad = (d.artifacts||[]).filter(a=>a.fileState!=='ok' || (a.staleDeps||[]).length);
  const s = d.summary||{};
  const rows = bad.map(a=>`<tr>
    <td class="mono dim" style="width:40px">${a.stage}</td>
    <td class="mono dim" style="font-size:10.5px">${esc(a.path)}</td>
    <td style="text-align:center">${a.fileState==='modified'?'<span class="badge b-bad" style="font-size:10px">文件已改动</span>'
      :a.fileState==='missing'?'<span class="badge b-bad" style="font-size:10px">文件缺失</span>':'<span class="dim">—</span>'}</td>
    <td style="font-size:11px" class="dim">${(a.staleDeps||[]).map(x=>esc(x.path)+'：'+esc(x.reason)).join('<br>')||'—'}</td>

  </div>
  <div class="panel"><div class="ph"><span>异常明细</span><span class="dim">按登记时记录的 sha256 比对当前文件</span></div>

async function confirmArt(path, verdict){
  const d = STG.data;
  const art = (d.artifacts||[]).find(a=>a.path===path);
  const r = await fetch('/api/artifact/confirm', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({path, verdict, kind:art?art.kind:"", scope:art?art.scope:"", stage:art?art.stage:""})});
  const j = await r.json();
  if(!r.ok) return toast(j.error||"记录失败");
  toast(verdict==='pass' ? ("已记录确认："+path) : ("已记录退回："+path));
  await loadStages(true);
  render();
}

      <td class="mono" style="color:${cur?'var(--acc)':'var(--dim)'}">${wf.episode}</td>

      <td style="text-align:center" class="dim">${dashes(bd.detail)}</td>
      <td style="text-align:center" class="dim">${dashes(r2.detail)}</td>
      <td style="text-align:center" class="dim">${wf.candidates?wf.candidates+" 条":dashes("")}</td>

      <td style="text-align:right">${done>=wf.steps.length
        ? '<span class="badge b-ok">完成</span>'

    : st==="hold"?'<span class="badge b-mut" style="font-size:10px;line-height:15px;padding:0 5px">待定</span>'
    : '<span class="badge" style="font-size:10px;line-height:15px;padding:0 5px;border-color:#2a303a;color:#5c6474">未审</span>';

      <div class="n">${s.id.slice(-3)}</div>

  }).join("");

  const refs = {};
  D.shots.filter(s=>s.scene===sc.id).forEach(s=>s.refs.forEach(r=>{
    if(!refs[r.key]) refs[r.key]={...r, n:0}; refs[r.key].n++;

  const refHtml = Object.values(refs).map(r=>
    `<div class="refrow" style="border:none;padding:4px 0">
      ${r.exists?`<span class="badge b-ok">✓</span>`:`<span class="badge b-bad">断链</span>`}

      </div><div class="dim" style="font-size:11px">${r.n} 处</div>
    </div>`).join("");

  return `

    <div class="panel" style="width:250px;flex-shrink:0">
      <div class="ph"><span>场次</span><span class="dim">已审 ${judged}/${S.scenes}</span></div>

}
function setV(id,v){ setU("scene",id,v); }
function draftOf(type,id){ return (state.drafts||{})[type+"::"+id] || ""; }
function setDraft(type,id,v){ state.drafts=state.drafts||{}; state.drafts[type+"::"+id]=v; }
function setU(type,id,v){
  vset(type,id,v);
  const gate = type==="shot" ? 2 : 1;
  const note = draftOf(type,id).trim();
  const body = {gate, unit:{type, id}, verdict:v,
    notes: note ? [{anchor:"", text:note.trim()}] : [],
    scope:{covers:[id], excludes:["其余单元","生成授权"]}};
  render();
  return fetch("/api/decision",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)})
    .then(r=>r.json())
    .then(j=>{
      if(j.ok){ setDraft(type,id,""); toast(`已落账 ${j.record.id} · ${({pass:"通过",revise:"需修改",hold:"待定"})[v]}`); render(); }
      else toast("落账失败："+(j.error||""));
    })
    .catch(e=>toast("落账失败："+e.message));
}

  const blocks = Object.entries(groups).map(([asset, list])=>{
    const adopted = (IMGST.adopted||{})[asset];
    const label = asset.replace(/^IMG-\d+-/, "");
    return `<div style="margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <b style="font-size:12.5px">${esc(label)}</b>

      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px">

function sR2(){
  if(!D.shots || !D.shots.length) return emptyPanel("r2");
  const groups = D.scenes.map(sc=>{
    let list = D.shots.filter(s=>s.scene===sc.id);
    if(state.filter==="broken") list=list.filter(s=>s.broken.length);
    if(state.filter==="noprompt") list=list.filter(s=>!s.motion);
    if(state.filter==="short") list=list.filter(s=>s.short);
    if(state.filter==="pending") list=list.filter(s=>!vget("shot",s.id));
    if(state.filter==="judged") list=list.filter(s=>!!vget("shot",s.id));
    if(state.filter==="revise") list=list.filter(s=>vget("shot",s.id)==="revise");
    if(state.filter==="picked") list=list.filter(s=>!!selOf(s.id));
    if(!list.length) return "";
    const cells = list.map(s=>{
      const sid = s.id.replace("SHOT-EP002-","");
      const badges=[
        s.broken.length?`<span class="badge b-bad">断链</span>`:"",
        s.short?`<span class="badge b-warn">短</span>`:"",
        !s.motion?`<span class="badge b-mut">无词</span>`:`<span class="badge b-acc">有词</span>`,
        D.chain[s.id]?`<span class="badge b-draft">链</span>`:"",
        selBadge(s.id)
      ].join("");
      const fr = (s.fields["景别/机位"]||"").split(/[，,。；]/)[0].slice(0,14);
      const chainStyle = D.chain[s.id] ? "border-left:3px solid var(--draft)" : "";
      return `<div class="cell" style="${chainStyle}" title="${esc(s.fields["景别/机位"]||"")}"
        onclick="go('shot',{shot:'${s.id}'})">
        <div class="noimg"></div>
        <div class="ci">
          <div class="cid">${sid}</div>
          <div class="cd">${s.dur}<small>s</small></div>
          <div class="dim" style="font-size:10.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(fr)}</div>
          <div class="cb">${badges}</div>
        </div></div>`;
    }).join("");
    return `<div class="sect">${sc.id} · ${esc(sc.place)} <span class="dim">${list.length} 镜 · ${list.reduce((a,b)=>a+b.dur,0)}s</span></div>
      <div class="wall" style="margin-bottom:18px">${cells}</div>`;
  }).join("");

  const f=(k,label)=>`<div class="chip ${state.filter===k?'on':''}" onclick="go('r2',{filter:'${k}'})">${label}</div>`;
  return `
  <div class="chips">
    ${f("all","全部 90")}${f("pending",`未审 ${D.shots.filter(s=>!vget("shot",s.id)).length}`)}
    ${f("judged",`已判 ${D.shots.filter(s=>vget("shot",s.id)).length}`)}
    ${f("revise",`需修改 ${D.shots.filter(s=>vget("shot",s.id)==="revise").length}`)}
    ${f("picked",`已选 ${D.shots.filter(s=>!!selOf(s.id)).length}`)}
    ${f("noprompt",`无提示词 ${S.shots-S.promptShots}`)}${f("short",`短镜 ${S.shortShots.length}`)}
  </div>
  ${groups||'<div class="dim">没有符合条件的镜头</div>'}`;
}

async function pollProgOnce(){
  try{
    // 生成台：只看该场产物有没有新增，别的抖动一律不重绘
    if(state.tab === 'gen'){
      if(!GEN.scene) return false;
      const r = await fetch('/api/gen/results?scene='+encodeURIComponent(GEN.scene)).then(x=>x.json()).catch(()=>null);
      if(!r) return false;
      const sig = JSON.stringify((r.results||[]).map(x=>[x.file, x.mtime]));
      if(sig === GEN.resSig) return false;
      const first = GEN.resSig === undefined;
      GEN.resSig = sig;
      GEN.results = r.results || [];
      return !first;
    }
    try{
      const sg = await fetch('/api/stages?sig=1').then(r=>r.json());
      if(sg && sg.sig && STG.sig && sg.sig !== STG.sig){
        STG.sig = sg.sig;
        await loadStages(true);
        render();
        return;
      }
      if(sg && sg.sig) STG.sig = sg.sig;
    }catch(e){}
    const p = await fetch('/api/comfy/progress').then(r=>r.json());
    const j = await fetch('/api/img/jobs').then(r=>r.json());
    const sig = JSON.stringify([p, (j.jobs||[]).map(x=>[x.id,x.status,x.startedAt])]);
    const changed = sig !== IMGST.lastSig;
    IMGST.lastSig = sig;
    IMGST.prog = p;
    IMGST.jobs = j.jobs||[];
    IMGST.seenFailed = IMGST.seenFailed || new Set();
    IMGST.notices = IMGST.notices || [];
    (IMGST.jobs||[]).forEach(x=>{
      if(x.status==='failed' && !IMGST.seenFailed.has(x.id)){
        IMGST.seenFailed.add(x.id);
        IMGST.notices.unshift({id:x.id, text:(x.dir||x.asset)+" · "+(x.error||"未知错误").slice(0,90)});
        changed = true;
      }
    });
    return changed;
  }catch(e){ return false; }
}

/* 灯箱：滚轮缩放 + 拖拽平移 */
function openZoom(src){
  let el = document.getElementById("zoomlayer");
  if(!el){
    el = document.createElement("div");
    el.id = "zoomlayer";
    el.style.cssText = "position:fixed;inset:0;background:rgba(6,8,11,.94);z-index:999;display:flex;align-items:center;justify-content:center;cursor:grab";
    document.body.appendChild(el);
  }
  el.innerHTML = `<img id="zoomimg" src="${src}" style="max-width:92vw;max-height:92vh;transform:scale(1);transition:transform .08s linear;user-select:none">
    <div style="position:absolute;top:14px;right:18px;color:#8b95a6;font-size:12px">滚轮缩放 · 拖拽平移 · ESC 关闭</div>`;
  el.style.display = "flex";
  let scale = 1, px = 0, py = 0, drag = null;
  const img = el.querySelector("#zoomimg");
  const apply = ()=>{ img.style.transform = `translate(${px}px,${py}px) scale(${scale})`; };
  el.onwheel = (e)=>{ e.preventDefault();
    scale = Math.min(8, Math.max(0.5, scale * (e.deltaY>0?0.9:1.1))); apply(); };
  el.onmousedown = (e)=>{ drag = [e.clientX-px, e.clientY-py]; el.style.cursor="grabbing"; };
  window.onmouseup = ()=>{ drag = null; if(el) el.style.cursor="grab"; };
  el.onmousemove = (e)=>{ if(!drag) return; px = e.clientX-drag[0]; py = e.clientY-drag[1]; apply(); };
  el.onclick = (e)=>{ if(e.target === el) closeZoom(); };
  el.dataset.zoom = "1";
}
function closeZoom(){
  const el = document.getElementById("zoomlayer");
  if(el){ el.style.display="none"; el.innerHTML=""; }
  window.onmouseup = null;
}
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeZoom(); });

async function adoptImg(asset, file){
  const r = await fetch('/api/img/adopt', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ep:D.episode, asset, file})});
  if(!r.ok) return toast("操作失败");
  IMGST.adopted = IMGST.adopted||{};
  if(file) IMGST.adopted[asset] = {asset, file};
  else { delete IMGST.adopted[asset]; delete IMGST.draft[asset]; }
  toast(file ? ("已采用 " + asset) : ("已取消采用 " + asset));
  render();
}

function copyText(btn){
  const pre = btn.parentElement.querySelector("pre");
  const txt = pre ? pre.innerText : "";
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast("已复制"),()=>toast("复制失败"));
}

  state.picks[shotId]=cid; toast("原型：已采用（不会保存）"); render();
}
function confirmDraft(){
  const m=state.candModal;
  state.picks[m.shotId]=m.cid+" · 草稿";
  state.candModal=null; toast("原型：已采用草稿，但需定稿后才算完成"); render();
}
function redo(shotId){ toast("原型：已标重做，会生成新任务并保留旧候选"); }

/* ---------- 批次 ---------- */
function sBatch(){
  if(!D.scenes || !D.scenes.length) return emptyPanel("batch");
  const batches = (D.batches||[]).filter(b=>!/IMG/.test(b.file)).map(b=>{
    const signed = (D.decisions||[]).find(d=>d.unit.type==="batch" && d.unit.id===b.file.replace(/\.md$/,""));
    return `<div onclick="openBatch('${esc(b.file.replace(/\.md$/,""))}')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);
        border-radius:8px;background:var(--panel);margin-bottom:8px;cursor:pointer">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px">${esc(b.title)}</div>
        <div class="dim" style="font-size:11.5px">${esc(b.file)} · ${b.bytes} bytes · ${esc(b.status||"—")}</div>
      </div>
      ${signed?`<span class="badge b-ok">已签字 ${signed.id}</span>`
              :`<button class="btn acc" style="font-size:12px;padding:5px 12px"
                 onclick="signBatch('${esc(b.file.replace(/\.md$/,""))}')">签字批准</button>`}
    </div>`;
  }).join("") + (D.decisions||[]).filter(d=>d.unit.type==="batch" && /VID/.test(d.unit.id)
      && !(D.batches||[]).some(b=>b.file.replace(/\.md$/,"")===d.unit.id))
    .map(d=>`<div onclick="openBatch('${esc(d.unit.id)}')" style="display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid #1e5b43;border-radius:8px;background:#0f1f19;margin-bottom:8px;cursor:pointer">
      <div style="flex:1;min-width:0">
        <div style="font-size:13px;font-family:ui-monospace,monospace">${esc(d.unit.id)}</div>
        <div class="dim" style="font-size:11.5px">已批准 · ${esc((d.scope&&d.scope.covers||[]).join("、")||"—")} · ${esc((d.created_at||"").slice(0,16))}</div>
      </div>
      <span class="badge b-ok">已批准</span>
    </div>`).join("") || '<div class="dim">还没有视频批次。</div>';

  const IDS=["SHOT-EP002-SC001-01","SHOT-EP002-SC001-02","SHOT-EP002-SC001-03A",
             "SHOT-EP002-SC001-03B","SHOT-EP002-SC001-03C"];
  const shots = IDS.map(shotById).filter(Boolean);
  const broken = shots.reduce((a,s)=>a+s.broken.length,0);
  const tasks = shots.length*3;
  const framesSum = shots.reduce((a,s)=>a+s.frames,0);
  const mins = Math.round(framesSum*3*106/124/60);
  return `
  <div class="panel" style="margin-bottom:14px">
    <div class="ph"><span>视频批次单</span><span class="dim">签字即写入一条 gate=3 的记录；图片批次在「出图」页</span></div>
    <div class="pb">${batches}
      ${state.preflight?`<div class="alert" style="margin:0;border-color:${state.preflight.ok?'#1e5b43':'#5c2323'};background:${state.preflight.ok?'#0f1f19':'#1d1212'};cursor:default">
        <div class="ic" style="background:${state.preflight.ok?'#0f2a20':'#2a1212'};color:${state.preflight.ok?'var(--ok)':'var(--bad)'}">${state.preflight.ok?'✓':'✕'}</div>
        <div style="flex:1"><b>预检${state.preflight.ok?'通过':'未通过'} · ${state.preflight.items} 项 · 预计 ${state.preflight.estMinutes==null?'—':state.preflight.estMinutes} 分钟</b>
          <div class="dim" style="font-size:12px;margin-top:3px">${esc(state.preflight.estNote||"")}</div>
          ${state.preflight.blockers.length?`<div style="font-size:12px;color:var(--bad);margin-top:6px">阻断 ${state.preflight.blockers.length} 项：<br>${state.preflight.blockers.map(x=>esc(x)).join("<br>")}</div>`:""}
          ${state.preflight.warnings.length?`<div style="font-size:12px;color:var(--warn);margin-top:6px">警告 ${state.preflight.warnings.length} 项：<br>${state.preflight.warnings.map(x=>esc(x)).join("<br>")}</div>`:""}
        </div></div>`:""}
      ${state.exec?`<div class="alert" style="margin:10px 0 0;border-color:#1c3f66;background:#0f1c2b;cursor:default">
        <div class="ic" style="background:#0f1c2b;color:var(--acc)">▶</div>
        <div style="flex:1"><b>${state.exec.running?"生成中":"批次结束"} · ${state.exec.done||0}/${state.exec.total||0} 完成${state.exec.failed?` · ${state.exec.failed} 失败`:""}</b>
          <div class="dim" style="font-size:12px;margin-top:3px">授权：${esc(state.exec.batch||"—")}${state.exec.startedAt?` · 开始 ${esc(state.exec.startedAt)}`:""}</div>
          ${(state.exec.log||[]).length?`<div class="mono" style="font-size:11px;color:#8b93a3;margin-top:6px;max-height:90px;overflow:auto">${state.exec.log.map(x=>esc(x)).join("<br>")}</div>`:""}
        </div></div>`:""}
      ${state.plan?`<div class="alert" style="margin:10px 0 0;border-color:${state.plan.ok?'#1e5b43':'#5c2323'};background:${state.plan.ok?'#0f1f19':'#1d1212'};cursor:default">
        <div class="ic" style="background:${state.plan.ok?'#0f2a20':'#2a1212'};color:${state.plan.ok?'var(--ok)':'var(--bad)'}">${state.plan.ok?'✓':'✕'}</div>
        <div style="flex:1"><b>${state.plan.ok?`已构造 ${state.plan.count} 条任务 · 预估 ${state.plan.estMinutes} 分钟`:'构造被拒'}</b>
          <div class="dim" style="font-size:12px;margin-top:3px;word-break:break-all">${state.plan.ok?`任务记录：${esc(state.plan.file)} · 状态「待执行」，未提交任何任务`:state.plan.blockers.map(x=>esc(x)).join("<br>")}</div>
        </div></div>`:""}
    </div>
  </div>
  ${(D.runs&&D.runs.length)?`<div class="panel" style="margin-bottom:14px">
    <div class="ph"><span>运行记录</span><span class="dim">追加式 · 最新 ${Math.min(D.runs.length,40)} 条</span></div>
    <div class="pb" style="max-height:220px;overflow:auto;font-size:12px">
      ${D.runs.slice().reverse().map(r=>`<div style="display:flex;gap:10px;padding:3px 0;border-bottom:1px solid #1b2028">
        <span class="mono dim" style="min-width:74px">${esc((r.at||"").slice(11,19))}</span>
        <span class="mono" style="min-width:92px;color:#aab3c2">${esc(r.task||"—")}</span>
        <span style="min-width:74px;color:${r.event==="succeeded"?"var(--ok)":r.event==="failed"?"var(--bad)":"var(--mut)"}">${esc(r.event||"")}</span>
        <span class="dim" style="flex:1;word-break:break-all">${esc(r.shot||"")}${r.files&&r.files.length?` · ${r.files.length} 个文件`:""}${r.error?" · "+esc(String(r.error).slice(0,60)):""}${r.simulated?" · 模拟":""}</span>
      </div>`).join("")}
    </div></div>`:""}
  <div class="row" style="gap:14px;align-items:flex-start">
    <div class="panel grow">
      <div class="ph"><span>待起草 · 视频批次</span><span class="badge b-warn">1 项阻断</span></div>
      <div class="pb">
        <table>
          <tr><th style="width:110px">镜头范围</th><td>${shots.map(s=>s.id.replace("SHOT-EP002-","")).join("、")} <span class="dim">（前 ${shots.length} 镜，本场共 ${sceneById("EP002-SC001").shotCount} 镜）</span></td></tr>
          <tr><th>档位</th><td><span class="badge b-draft">草稿 turbo6</span> <span class="dim">先定拍法，再出定稿</span></td></tr>
          <tr><th>每镜候选</th><td>3 条 · 共 <b>${tasks}</b> 条任务</td></tr>
          <tr><th>预估耗时</th><td><b>${framesSum*3} 帧 ≈ ${mins} 分钟</b> <span class="dim">（按实测 106s/124 帧 线性外推）</span></td></tr>
          <tr><th>输入版本</th><td class="mono" style="font-size:12px">分镜 sha256:ab12… · 提示词 sha256:cd34… · 参考图 3 张</td></tr>
          <tr><th>参数</th><td class="mono" style="font-size:12px">1344×768 · 124–192 帧 · res_multistep + simple · cfg=1 · seed 记录</td></tr>
          <tr><th>输出</th><td class="mono" style="font-size:12px">剧集/EP002/制作成果/候选/SC001/</td></tr>
          <tr><th>上限</th><td>GPU ${mins*2} 分钟（含重试）· 网络/损坏 ≤2 次 · 内容不满意不自动重抽</td></tr>
          <tr><th>停止</th><td>连续失败 3 次 / 达上限 / 手动</td></tr>
        </table>
        <div class="alert" style="margin-top:14px;border-color:${broken?'#5c2323':'#1e5b43'};background:${broken?'#1d1212':'#0f1f19'};cursor:default">
          <div class="ic" style="background:${broken?'#2a1212':'#0f2a20'};color:${broken?'var(--bad)':'var(--ok)'}">${broken?'✕':'✓'}</div>
          <div><b>${broken?`无法提交：${broken} 处参考图缺失`:'参考图校验通过'}</b>
            <div class="dim" style="font-size:12px">${broken?'补齐后才能批准':'5 镜 × 3 张引用全部指向现存文件（6 视图 / 办公室场景图）'}</div></div>
        </div>
        <div style="margin-top:14px;display:flex;gap:8px">
          <button class="btn" onclick='runPreflight(${JSON.stringify(IDS)})'>预检本批</button>
          <button class="btn" onclick='planTasks(${JSON.stringify(IDS)})'>构造任务（不提交）</button>
          <button class="btn acc" onclick='executeBatch(${JSON.stringify(IDS)})'
            title="会记录一条 gate=3 授权，并在后台提交">批准并提交 ${tasks} 条</button>
          <a class="btn ghost" href="/api/export" download style="text-decoration:none">导出修改单</a>
        </div>
      </div>
    </div>
    <div class="panel" style="width:330px;flex-shrink:0">
      <div class="ph"><span>提交前校验</span></div>
      <div class="pb" style="font-size:12.5px;line-height:2">
        <div><span class="badge ${broken?"b-bad":"b-ok"}">${broken?"✕":"✓"}</span> 参考图存在且可解码</div>
        <div><span class="badge b-warn">!</span> 画幅 16:9 未验证（现有实测为竖屏）</div>
        <div><span class="badge b-ok">✓</span> 帧数区间合法</div>
        <div><span class="badge b-ok">✓</span> 提示词六段齐全（3/5 镜）</div>
        <div><span class="badge b-ok">✓</span> 批次六要素齐全</div>
      </div>
      <div class="ph" style="border-top:1px solid var(--line)"><span>说明</span></div>
      <div class="pb dim" style="font-size:12px">
        创作通过与生成授权是两条独立记录。批准此处只代表同意这 15 条任务，不代表整场/整集通过。
      </div>
    </div>
  </div>`;
}


/* ---------- 修改单 ---------- */
const NOTES={
  "EP002-SC001":"招呼之后再给一个陈铭抬头的反应，别在同一句里抢拍。",
  "EP002-SC003":"第一杯酒之后，陈铭难受的反应不要切成喜剧节拍。"
};
function sExport(){
  const LABEL={pass:"通过",revise:"需修改",hold:"待定",na:"不适用"};
  const scn = (D.decisions||[]).filter(d=>d.unit&&d.unit.type==="scene");
  const sht = (D.decisions||[]).filter(d=>d.unit&&d.unit.type==="shot");
  const ast = (D.decisions||[]).filter(d=>d.unit&&d.unit.type==="asset");
  const row=(d)=>{
    const note=(d.notes||[]).map(n=>n.text).filter(Boolean).join("；");
    return `- [${d.unit.id}] ${LABEL[d.verdict]||d.verdict}${note?`\n  意见：${note}`:""}\n  记录：${d.id} · ${d.created_at||""}`;
  };
  const lines = [...scn,...sht,...ast].map(row).join("\n") || "- （尚未有任何判定）";
  const md = `## 审核一 第 1 轮（2026-11-18）

${lines}

### 待导演确认的原著改编（${S.adapted.length} 句，剧本「本版改编说明」已声明）
${S.adapted.map(a=>`- [${a.scene.slice(-3)}] ${a.spk}："${a.text}" — 原著为叙述，本稿转为对白`).join("\n")}

### 机械检查附带（不由导演判定）
- 参考图引用失效 89 处，涉及 89/90 镜：陈铭5视图4.png 不存在
- 3 镜低于 124 帧下限：SC001-02、R025、R068
- 视频提示词覆盖 3/90

影响范围：SC001 剧本与分镜；90 镜中 89 镜的参考图；SC001 前五镜的生成授权仍为「未批准」
`;
  return `
  <div class="row" style="gap:14px;align-items:flex-start">
    <div class="panel grow">
      <div class="ph"><span>给 Agent 的修改单</span><span class="dim">由当前判定实时生成</span></div>
      <div class="pb">
        <pre class="mono" style="margin:0;white-space:pre-wrap;font-size:12.5px;line-height:1.75;color:#c9d2e0">${esc(md)}</pre>
      </div>
      <div class="verdict">
        <a class="btn acc" href="/api/export" download style="text-decoration:none">下载 .md</a>
        <button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.querySelector('pre').innerText).then(()=>toast('已复制'),()=>toast('复制失败'))">复制</button>
        <button class="btn ghost" onclick="toast('原型：会写入 制作运行/decisions.jsonl')">落账为决策记录</button>
        <span class="dim" style="margin-left:auto;font-size:11.5px">工作台不直接改稿，只给指令</span>
      </div>
    </div>
    <div class="panel" style="width:330px;flex-shrink:0">
      <div class="ph"><span>为什么这样设计</span></div>
      <div class="pb dim" style="font-size:12.5px;line-height:1.9">
        创作文件由 Agent 维护，工作台只读。<br>
        导演的意见带着锚点和范围出去，Agent 改完回写，工作台比对哈希、只让你复核受影响项。<br><br>
        这样不会出现"两份剧本"。
      </div>
    </div>
  </div>`;
}

/* ---------- 路由 ---------- */
function sEpSel(){
  const eps = D.episodes || [];
  if(!eps.length){
    return `<button class="epbtn" onclick="toast('项目里没有 项目开发/episode-map.jsonl，选集不可用')">
      <span class="proj">${D.project?esc(String(D.project).split(' · ')[0]):'项目'}</span>
      <span class="sep">·</span><i class="st" style="background:var(--bad)"></i>
      <span class="cur">无分集数据</span></button>`;
  }
  const cur = eps.find(e=>e.id===state.ep) || eps[0];
  const dot = cur.hasScript ? "var(--acc)" : "var(--dim)";
  return `
  <button class="epbtn" onclick="state.epOpen=!state.epOpen;render()">
    <span class="proj">有谁共鸣2</span>
    <span class="sep">·</span>
    <i class="st" style="background:${dot}"></i>
    <span class="cur">${cur.id} ${esc(cur.title)}</span>
    <span class="car">▾</span>
  </button>
  ${state.epOpen?`<div class="epmenu">${D.episodes.map(e=>`
    <div class="epitem ${e.id===cur.id?'on':''}" onclick="pickEp('${e.id}')">
      <i class="st" style="background:${e.hasScript?'var(--acc)':'var(--dim)'}"></i>
      <span class="n">${e.id}</span>
      <span class="t">${esc(e.title)}</span>
      <span class="s">${e.hasScript?'制作中':'仅大纲'}</span>
    </div>`).join("")}</div>`:''}`;
}
function pickEp(id){
  state.epOpen = false;
  state.ep = id;
  render();
  // 真应用里 loadEp 会按集重新拉数据；模板单独打开时没有则只切高亮
  if (typeof loadEp === "function") return loadEp(id);
}

function sEmptyEp(){
  const e = D.episodes.find(x=>x.id===state.ep);
  return `
  <div class="panel" style="max-width:860px">
    <div class="ph"><span><b>${e.id}</b> · ${esc(e.title)}</span><span class="badge b-mut">仅大纲</span></div>
    <div class="pb">
      <dl class="kv">
        <dt>原著</dt><dd>第 ${e.chapters?e.chapters[0]:""}–${e.chapters?e.chapters[1]:""} 章</dd>
        <dt>目标时长</dt><dd class="mono">${mmss(e.target)}</dd>
        <dt>钩子</dt><dd>${esc(e.hook||"—")}</dd>
        <dt>目标</dt><dd>${esc(e.objective||"—")}</dd>
      </dl>
      <div class="alert" style="margin-top:16px;cursor:default">
        <div class="ic" style="background:#2a1f0d;color:var(--warn)">!</div>
        <div><b>本集尚无 剧本.md / 视觉设定.md / 分镜.md</b>
          <div class="dim" style="font-size:12px">工作台不会凭空生成创作内容。需要先由 Agent 按大纲产出剧本草案，才能进入审核一。</div></div>
      </div>
      <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn ghost" onclick="go('overview')">回到全剧总览</button>
        <button class="btn ghost" onclick="toast('原型：会导出一份「本集待编写」任务单给 Agent')">导出编写任务单</button>
      </div>
    </div>
  </div>`;
}

function render(){
  nav();
  document.getElementById("epsel").innerHTML = sEpSel();
  document.getElementById("bannerStat").textContent =
    `${S.scenes} 场 · ${S.shots} 镜 · ${(S.totalDur/60).toFixed(1)} 分 · 断链 ${S.brokenOcc} 处`;
  const map={overview:sOverview,workflow:sWorkflow,dev:sDev,r1:sR1,r1a:sR1a,r2:sR2,shot:sShot,checks:sChecks,pick:sPick,batch:sBatch,img:sImg,img2:sImg2,export:sExport};
  const epScoped = ["r1","r2","shot","pick","batch","img","export","checks","workflow"];
  let html;
  if (state.tab === "stages") {
    html = sStages();
  } else if (state.tab === "scenes") {
    html = sScenes();
  } else if (state.tab === "assets") {
    html = sAssetsPage();
  } else if (state.tab === "shots") {
    html = sShots();
  } else if (state.tab === "gen") {
    html = sGen();
  } else if (state.tab === "backend") {
    html = sBackend();
  } else if (state.tab === "stage") {
    html = sStage();
  } else if (state.tab === "pending") {
    html = sPending();
  } else if (state.tab === "arts") {
    html = sArts();
  } else if (state.tab === "verify") {
    html = sVerify();
  } else if (state.tab === "overview") {
    html = sOverview();
  } else if (state.tab === "workflow") {
    html = sWorkflow();
  } else if (state.tab === "dev") {
    html = sDev();
  } else if (D && D.empty) {
    html = sLegacy();
  } else if (D && D.episode && state.ep !== D.episode) {
    html = emptyPanel(state.tab);
  } else {
    html = (map[state.tab] || sStages)();
  }
  document.getElementById("app").innerHTML = statusBar() + html;
  if(state.batchModal) document.body.insertAdjacentHTML("beforeend", batchModalHtml());
  if(state.candModal) showDraftModal();
  else {
    const m=document.querySelector(".modal"); if(m && !state.candModal) m.remove();
  }
}
function showDraftModal(){
  const m=document.createElement("div");
  m.className="modal";
  m.innerHTML=`<div class="box">
    <div style="font-size:15px;font-weight:600;margin-bottom:8px">这是草稿，不建议直接采用</div>
    <div class="muted" style="font-size:13px;line-height:1.8">
      实测：草稿（turbo）的身份相似度从 0.61 掉到 0.53，且呈时间漂移；音量比定稿高约 27 dB。<br>
      草稿适合判断构图、表演、口型；正式采用前应同 seed 出定稿。
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
      <button class="btn ghost" onclick="state.candModal=null;render()">取消</button>
      <button class="btn ok" onclick="confirmDraft()">仍然采用（标记待定稿）</button>
    </div></div>`;
  document.body.appendChild(m);
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && state.candModal){ state.candModal=null; render(); }});
render();
</script>
