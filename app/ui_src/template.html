  const s = shotById(state.shot) || D.shots[0];
  const f = s.fields;
  const kv=(k,label)=> f[k]?`<dt>${label}</dt><dd>${esc(f[k])}</dd>`:"";
  const refs = s.refs.map(r=>{
    const img = r.exists ? ("/assetthumb?p=" + encodeURIComponent(r.path)) : "";
    return `<div class="refrow">
      ${r.exists?`<img src="${img}">`:`<div class="miss">文件<br>缺失</div>`}
      <div style="flex:1;min-width:0">
        <div class="mono" style="font-size:12px">${r.key} <span class="dim">顺序 ${r.order}</span>
          ${r.exists?'<span class="badge b-ok">✓</span>':'<span class="badge b-bad">断链</span>'}</div>
        <div class="dim" style="font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.path)}</div>
      </div></div>`;
  }).join("");

  const six = s.motion ? Object.entries(s.motion.six) : [];
  const sixHtml = six.map(([k,v])=>`<div style="margin-bottom:10px">
      <div class="dim mono" style="font-size:11px">${k}</div>
      <div style="font-size:12.5px;color:#c9d2e0;white-space:pre-wrap">${esc(v)}</div></div>`).join("");

  const chain = D.chain[s.id];
  return `
  <div class="row" style="align-items:flex-start;gap:14px">
    <div class="panel grow" style="min-width:0">
      <div class="ph"><span><b>${s.id}</b> · ${esc(s.title)} ${verdictBadge(vget("shot",s.id))}${staleBadge("shot",s.id)}</span>
        <span style="display:flex;align-items:center;gap:8px">
          ${(()=>{const i=D.shots.findIndex(x=>x.id===s.id);
            return `${i>0?`<button class="btn ghost" style="padding:2px 8px;font-size:12px" onclick="go('shot',{shot:'${D.shots[i-1].id}'})">‹ 上一镜</button>`:""}
                    <span class="dim" style="font-size:11.5px">${i+1}/${D.shots.length}</span>
                    ${i<D.shots.length-1?`<button class="btn ghost" style="padding:2px 8px;font-size:12px" onclick="go('shot',{shot:'${D.shots[i+1].id}'})">下一镜 ›</button>`:""}`;})()}
        </span>
        <span>剪辑 ${s.dur}s · 生成 ${s.frames} 帧 = ${s.genSec.toFixed(2)}s${s.trim>0.02?` · 裁 ${s.trim.toFixed(2)}s`:""}</span></div>
      <div class="pb" style="max-height:calc(100vh - 300px);overflow:auto">
        ${chain?`<div class="alert" style="cursor:default;margin-bottom:12px">
          <div class="ic" style="background:#1a1630;color:var(--draft)">链</div>
          <div><b>台词链组 ${chain.group}</b>：本镜与 ${chain.shots.join(" + ")} 共用同一句台词
          <div class="dim" style="font-size:12px">"${esc(chain.text.slice(0,40))}…" — 挑片时必须连看，否则会误判"少了半句"</div></div>
        </div>`:""}
        ${s.short?`<div class="alert" style="cursor:default;margin-bottom:12px">
          <div class="ic" style="background:#2a1f0d;color:var(--warn)">!</div>
          <div><b>时长低于模型训练下限</b>：${s.dur}s → 吸附 ${s.frames} 帧 = ${s.genSec.toFixed(2)}s，H3 训练区间从 124 帧（5.17s）起
          <div class="dim" style="font-size:12px">按 124 帧生成再裁到 ${s.dur}s（裁 1.17s），或把本镜写到 5s 以上</div></div>
        </div>`:""}
        <dl class="kv">
          ${kv("来源","来源")}${kv("目的","目的")}${kv("景别/机位","景别/机位")}${kv("运镜","运镜")}
          ${kv("起点","起点")}${kv("动作","动作")}${kv("终点","终点")}${kv("声音","声音")}
        </dl>
      </div>
      ${selOf(s.id)?`<div class="pb" style="border-top:1px solid var(--line);background:#0f1f19">
        <div style="display:flex;align-items:center;gap:10px;font-size:12.5px">
          ${selBadge(s.id)}
          <span class="mono dim" style="font-size:11.5px;flex:1;word-break:break-all">${esc(selOf(s.id).candidate)}</span>
          <button class="btn ghost" style="font-size:12px;padding:3px 9px" onclick="go('pick')">去挑片</button>
        </div>
        ${(selOf(s.id).reason||[]).length?`<div class="dim" style="font-size:11.5px;margin-top:4px">原因：${esc(selOf(s.id).reason.join("、"))}</div>`:""}
      </div>`:""}
      <div class="verdict">
        <input placeholder="本镜意见" value="${esc(draftOf('shot',s.id))}" oninput="setDraft('shot','${s.id}',this.value)"
          style="flex:1;min-width:140px;background:#0f1216;border:1px solid var(--line);
                 border-radius:6px;padding:6px 10px;color:var(--tx);font-size:12.5px">
        <button class="btn ok" onclick="setU('shot','${s.id}','pass')">通过本镜</button>
        <button class="btn warn" onclick="setU('shot','${s.id}','revise')">需修改</button>
        <button class="btn ghost" onclick="setU('shot','${s.id}','hold')">待定</button>
        <span class="dim" style="margin-left:auto;font-size:11.5px">仅本镜，不含同场其余 ${sceneById(s.scene).shotCount-1} 镜</span>
      </div>
    </div>

    <div class="col" style="width:520px;flex-shrink:0;gap:14px">
      <div class="panel">
        <div class="ph"><span>首帧提示词</span><span class="dim">${s.firstFrame?"已编写":"缺失"}</span></div>
        <div class="pb" style="font-size:12.5px;color:#c9d2e0;max-height:170px;overflow:auto">${esc(s.firstFrame||"—")}</div>
      </div>

        <div class="ph"><span>视频提示词（H3 六段式）</span>
          <span>${s.motion?'<span class="badge b-acc">已编写</span>':'<span class="badge b-warn">未编写</span>'}</span></div>
        <div class="pb" style="max-height:300px;overflow:auto">
          ${s.motion?sixHtml:`<div class="dim" style="font-size:12.5px">本镜尚无视频提示词。按流程，90 镜中只有 3 镜已编写，其余不能视为可投产。</div>`}
        </div>
      </div>
      <div class="panel">
        <div class="ph"><span>参考图</span><span class="dim">${s.refs.filter(r=>!r.exists).length} 处断链</span></div>
        <div class="pb">${refs}</div>
      </div>
    </div>
  </div>`;
}

async function loadImg(){

function progHtml(){
  const p = IMGST.prog;
  if(!p) return "";
  const jobs = IMGST.jobs || [];
  const active = jobs.filter(j=>['starting','running'].includes(j.status));
  const waiting = jobs.filter(j=>j.status==='queued');
  if(!active.length && !waiting.length) return noticesHtml();
  const now = Date.now()/1000;

  const row = (j, idx) => {
    const secs = j.startedAt ? Math.round(now - j.startedAt) : null;
    const st = j.status;
    const badge = st==='running' ? '<span class="badge b-acc" style="font-size:10px">生成中</span>'
      : st==='starting' ? '<span class="badge b-warn" style="font-size:10px">启动中</span>'
      : '<span class="badge b-mut" style="font-size:10px">排队</span>';
    return `<div style="display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid #1b2028">
      <span class="mono dim" style="font-size:10.5px;width:32px">${idx}</span>

    </div>`;
  };

  return noticesHtml() + `<div class="panel" style="margin-bottom:14px">
    <div class="ph"><span>生成队列</span><span class="dim">${p.batch?esc(p.batch):''} · ${p.done}/${p.total} 完成</span></div>
    <div class="pb">

      ${waiting.length?`<div style="display:flex;align-items:center;gap:8px;margin:10px 0 4px">

function uiBusy(){

async function pollTick(){

                                    b.jobs.map(j=>[j.id,j.status,j.etaSec]),
                                    (b.instances||[]).map(i=>[i.card,i.pid])]);
        if(sig !== BK.sig){ BK.sig = sig; BK.data = b; render(); }
      }

    }

async function pollProgOnce(){
  if(uiBusy()) return false;
  try{
    // 生成台：只看该场产物有没有新增，别的抖动一律不重绘
    if(state.tab === 'history'){
      return false;
    }
    if(state.tab === 'gen'){
      if(!GEN.scene) return false;
      const r = await fetch('/api/gen/results?scene='+encodeURIComponent(GEN.scene)).then(x=>x.json()).catch(()=>null);
      if(!r) return false;
      const sig = JSON.stringify((r.results||[]).map(x=>[x.file, x.mtime]));
      if(sig === GEN.resSig) return false;
      const first = GEN.resSig === undefined;
      GEN.resSig = sig;
      GEN.results = r.results || [];
      return !first;
    }
    try{
      const sg = await fetch('/api/stages?sig=1').then(r=>r.json());
      if(sg && sg.sig && STG.sig && sg.sig !== STG.sig){
        STG.sig = sg.sig;
        await loadStages(true);
        render();
        return;
      }
      if(sg && sg.sig) STG.sig = sg.sig;
    }catch(e){}
    const p = await fetch('/api/comfy/progress').then(r=>r.json());
    const j = await fetch('/api/img/jobs').then(r=>r.json());
    const v = await fetch('/api/gen/active').then(r=>r.json()).catch(()=>({jobs:[]}));
    const sig = JSON.stringify([p, (j.jobs||[]).map(x=>[x.id,x.status,x.startedAt]),
                                (v.jobs||[]).map(x=>[x.id,x.status,x.queueState])]);
    const changed = sig !== IMGST.lastSig;
    IMGST.lastSig = sig;
    IMGST.prog = p;
    IMGST.jobs = j.jobs||[];
    IMGST.vjobs = v.jobs||[];
    IMGST.seenFailed = IMGST.seenFailed || new Set();
    IMGST.notices = IMGST.notices || [];
    (IMGST.jobs||[]).forEach(x=>{
      if(x.status==='failed' && !IMGST.seenFailed.has(x.id)){
        IMGST.seenFailed.add(x.id);
        IMGST.notices.unshift({id:x.id, text:(x.dir||x.asset)+" · "+(x.error||"未知错误").slice(0,90)});
        changed = true;
      }
    });
    return changed;
  }catch(e){ return false; }
}

function bump(id, d){

  render();
}
function bumpAll(d){
  IMGST.allN = Math.max(1, Math.min(16, (IMGST.allN || 4) + d));

}
function setAllN(v){

}
function applyAll(){
  const n = IMGST.allN || 4;
  (IMGST.items||[]).forEach(it=>{
    if(ADOPTED_OF(it) || !it.prompt) return;
    IMGST.draft[it.id] = n;
  });
  render();
}
function addDraft(id, n){
  IMGST.draft[id] = (IMGST.draft[id]||0) + (n||1);
  render();
}
function addAllDraft(){
  (IMGST.items||[]).forEach(it=>{
    if(ADOPTED_OF(it)) return;
    if(!it.prompt) return;
    if(IMGST.draft[it.id]) return;
    IMGST.draft[it.id] = IMGST.allN || 4;
  });

}
function clearDraft(){ IMGST.draft={}; render(); }
function setDraft(id, v){

function ADOPTED_OF(it){
  const ad = IMGST.adopted || {};

/* 灯箱：滚轮缩放 + 拖拽平移 */
function openZoom(src){
  let el = document.getElementById("zoomlayer");
  if(!el){
    el = document.createElement("div");
    el.id = "zoomlayer";
    el.style.cssText = "position:fixed;inset:0;background:rgba(6,8,11,.94);z-index:10000;display:flex;align-items:center;justify-content:center;cursor:grab";
    document.body.appendChild(el);
  }
  el.innerHTML = `<img id="zoomimg" src="${src}" style="max-width:92vw;max-height:92vh;transform:scale(1);transition:transform .08s linear;user-select:none">
    <div style="position:absolute;top:14px;right:18px;color:#8b95a6;font-size:12px">滚轮缩放 · 拖拽平移 · ESC 关闭</div>`;
  el.style.display = "flex";
  let scale = 1, px = 0, py = 0, drag = null;
  const img = el.querySelector("#zoomimg");
  const apply = ()=>{ img.style.transform = `translate(${px}px,${py}px) scale(${scale})`; };
  el.onwheel = (e)=>{ e.preventDefault();
    scale = Math.min(8, Math.max(0.5, scale * (e.deltaY>0?0.9:1.1))); apply(); };
  el.onmousedown = (e)=>{ drag = [e.clientX-px, e.clientY-py]; el.style.cursor="grabbing"; };
  window.onmouseup = ()=>{ drag = null; if(el) el.style.cursor="grab"; };
  el.onmousemove = (e)=>{ if(!drag) return; px = e.clientX-drag[0]; py = e.clientY-drag[1]; apply(); };
  el.onclick = (e)=>{ if(e.target === el) closeZoom(); };
  el.dataset.zoom = "1";
}
function closeZoom(){
  const el = document.getElementById("zoomlayer");
  if(el){ el.style.display="none"; el.innerHTML=""; }
  window.onmouseup = null;
}
document.addEventListener("keydown", (e)=>{ if(e.key==="Escape") closeZoom(); });

async function adoptImg(asset, file){
  const r = await fetch('/api/img/adopt', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ep:D.episode, asset, file})});
  if(!r.ok) return toast("操作失败");
  IMGST.adopted = IMGST.adopted||{};
  if(file) IMGST.adopted[asset] = {asset, file};
  else { delete IMGST.adopted[asset]; delete IMGST.draft[asset]; }
  toast(file ? ("已采用 " + asset) : ("已取消采用 " + asset));
  render();
}

function copyText(btn){
  const pre = btn.parentElement.querySelector("pre");
  const txt = pre ? pre.innerText : "";
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>toast("已复制"),()=>toast("复制失败"));
}

/* ---------- 区域渲染：只替换真正变化的区域，并保住滚动/焦点/展开态 ---------- */
const PAINT = {applied: 0, skipped: 0};

function _uiSnapshot(host){
  if(!host || !host.querySelectorAll) return null;
  const active = document.activeElement;
  const snap = {scrollTop: (document.scrollingElement||{}).scrollTop || 0,
                focusId: null, selStart: null, selEnd: null, open: []};
  try{
    if(active && host.contains && host.contains(active)){
      snap.focusId = active.id || null;
      if(active.selectionStart != null){ snap.selStart = active.selectionStart; snap.selEnd = active.selectionEnd; }
    }
    snap.open = [...host.querySelectorAll("details")].map(d=>!!d.open);
  }catch(e){}
  return snap;
}

function _uiRestore(host, snap){
  if(!snap || !host) return;
  try{
    const ds = [...host.querySelectorAll("details")];
    ds.forEach((d,i)=>{ if(i < snap.open.length) d.open = snap.open[i]; });
    if(snap.focusId){
      const el = host.querySelector("#" + snap.focusId) || document.getElementById(snap.focusId);
      if(el && el.focus){ el.focus({preventScroll:true});
        if(snap.selStart != null && el.setSelectionRange) el.setSelectionRange(snap.selStart, snap.selEnd); }
    }
  }catch(e){}
  const sc = document.scrollingElement || document.documentElement;
  if(sc && snap.scrollTop){ sc.scrollTop = snap.scrollTop;
    requestAnimationFrame(()=>{ if(sc.scrollTop !== snap.scrollTop) sc.scrollTop = snap.scrollTop; }); }
}

function paint(sel, html){
  const host = document.querySelector ? document.querySelector(sel) : document.querySelector(sel);
  if(!host) return false;
  if(host.__html === html){ PAINT.skipped++; return false; }   // 内容没变：绝不触碰 DOM
  const snap = _uiSnapshot(host);
  host.__html = html;
  host.innerHTML = html;
  _uiRestore(host, snap);
  PAINT.applied++;
  return true;
}

}
function showDraftModal(){
  const m=document.createElement("div");
  m.className="modal";
  m.innerHTML=`<div class="box">
    <div style="font-size:15px;font-weight:600;margin-bottom:8px">这是草稿，不建议直接采用</div>
    <div class="muted" style="font-size:13px;line-height:1.8">
      实测：草稿（turbo）的身份相似度从 0.61 掉到 0.53，且呈时间漂移；音量比定稿高约 27 dB。<br>
      草稿适合判断构图、表演、口型；正式采用前应同 seed 出定稿。
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:18px">
      <button class="btn ghost" onclick="state.candModal=null;render()">取消</button>
      <button class="btn ok" onclick="confirmDraft()">仍然采用（标记待定稿）</button>
    </div></div>`;
  document.body.appendChild(m);
}
let PROJECTS = null;
async function loadProjects(){
  try{ PROJECTS = await (await fetch('/api/projects')).json(); }catch(e){ PROJECTS = null; }
  const el=document.getElementById('projsel'); if(el) el.innerHTML = sProjSel();
}
function sProjSel(){
  if(!PROJECTS || !PROJECTS.projects) return '<span class="dim">项目…</span>';
  const opts=PROJECTS.projects.map(p=>`<option value="${esc(p.path)}" ${p.path===PROJECTS.active?'selected':''}>${esc(p.name)}${p.hasArtifacts?' · '+p.artifactCount+'项':''}${p.hasAgents?'':' · 无技能'}</option>`).join('');
  return `<select onchange="switchProject(this.value)" title="切换项目" style="background:#0f1216;border:1px solid var(--line);color:#c9d2e0;border-radius:6px;padding:3px 8px;font-size:12px;max-width:240px">${opts}<option value="__new__">＋ 初始化新项目…</option></select>`;
}
async function switchProject(path){
  if(path==='__new__'){
    const name=prompt('新项目名（建在 ~/short_v 下，会复制 .agents 技能模板）：');
    if(!name) return;
    const r=await fetch('/api/project/init',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
    const j=await r.json();
    if(!r.ok) return toast(j.error||'初始化失败');
    toast('已创建并切换：'+j.project.name); location.reload(); return;
  }
  const r=await fetch('/api/project/switch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path})});
  const j=await r.json();
  if(!r.ok) return toast(j.error||'切换失败');
  location.reload();
}
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && state.candModal){ state.candModal=null; render(); }});
loadProjects();
render();
</script>
</body>
</html>
